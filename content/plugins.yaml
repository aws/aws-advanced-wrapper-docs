# ===========================================================================
# RULE — READ BEFORE EDITING
# ---------------------------------------------------------------------------
# EACH WRAPPER'S DOCS ARE STANDALONE. NO CROSS-WRAPPER REFERENCES.
# Text rendered into a wrapper's page must never mention, name, compare to, or
# imply another wrapper. A wrapper naming ITSELF is fine ("Ruby"). These
# non-rendered maintainer comments MAY reference the wrapper.
#
# This is the single source of truth for the shared plugin pages. The build
# reads it and produces one clean, wrapper-specific page per wrapper, so a
# parameter name/unit/default cannot drift between prose and table.
# ===========================================================================

# ---------------------------------------------------------------------------
# Parameter TYPE display map (canonical -> per-wrapper spelling).
# ---------------------------------------------------------------------------
typeNames:
  string:
    ruby: "String"
  boolean:
    ruby: "Boolean"
  integer:
    ruby: "Integer"
  float:
    ruby: "Float"
  long:
    ruby: "Integer"
  symbol:
    ruby: "Symbol"
  object:
    ruby: "Object"

# ---------------------------------------------------------------------------
# Per-wrapper metadata reused by every plugin page. Merged into the base
# wrapper context by the `plugins` context profile.
# ---------------------------------------------------------------------------
wrappers:
  ruby:
    wrapperName: "AWS Advanced Ruby Driver Wrapper"
    label: "Ruby"
    codeLang: "ruby"
    pluginListParam: "wrapper_plugins"
    compatibilityGuide: "../../compatibility"

# ---------------------------------------------------------------------------
# Plugin registry.
#
# Each entry is keyed by the page's path last segment (e.g. `iam-authentication`
# for `using-plugins/iam-authentication`). The `plugins` context profile picks
# the entry, filters everything to the current wrapper, and exposes it to the
# template as `plugin`.
#
# Per plugin:
#   availableWrappers : wrappers this page renders for (must match pages.yaml).
#   code              : per-wrapper plugin code for the plugin list parameter.
#   availableSince    : per-wrapper "Available since" string.
#   enableSnippet     : per-wrapper connection snippet enabling the plugin.
#   parameters[]      : each has type, per-wrapper availability + spellings
#                       (name/required/default/example) and a shared or
#                       per-wrapper description.
#   wrapperOnly       : per-wrapper appended prose blocks (verbatim from the
#                       source docs, so wrapper-specific notes are preserved).
# ===========================================================================

plugins:

  # =========================================================================
  # IAM Authentication Plugin
  # =========================================================================
  iam-authentication:
    availableWrappers: [ruby]
    intro: |
      AWS Identity and Access Management (IAM) grants users access control across
      AWS services with granular permissions. The IAM Authentication Plugin enables
      [IAM database authentication](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html)
      for connections: instead of a static password, the plugin generates a
      short-lived IAM authentication token and injects it into the connection
      properties before each connection attempt. For more information on IAM, see
      the [IAM documentation](https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html).
    code:
      ruby: iam
    pluginGroup: auth
    availableSince:
      ruby: "1.0.0"
    hostRequirement: |
      When using IAM database authentication, the connection host must be a valid
      Amazon RDS endpoint — not a custom domain or an IP address — for example
      `my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com`. When connecting
      through a custom Aurora cluster endpoint, set the host override parameter to a
      valid RDS endpoint instead. IAM database authentication is limited to certain database
      engines; see the
      [IAM database authentication documentation](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html).
    enableSnippet:
      ruby: |
        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
          user: "iam_user",
          wrapper_plugins: "iam",
          sslmode: "verify-full",
          sslrootcert: "/path/to/global-bundle.pem"
        )
    parameters:
      - concept: iamHost
        type: string
        description: "Overrides the hostname used to generate the IAM token. Required when connecting through a custom endpoint. The default is derived from the connection host."
        spellings:
          ruby: { name: iam_host, required: "No", defaultNote: "derived from host", example: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com" }
      - concept: iamPort
        type: integer
        description: "Overrides the port used to generate the IAM token. The default is determined from the underlying driver protocol or the dialect default."
        spellings:
          ruby: { name: iam_port,       required: "No", defaultNote: "dialect default", example: "5432" }
      - concept: iamRegion
        type: string
        description: "Overrides the AWS region used to generate the IAM token. The default is parsed from the connection string."
        spellings:
          ruby: { name: iam_region, required: "No", defaultNote: "parsed from host", example: "us-east-1" }
      - concept: iamExpiration
        type: integer
        description: "Number of seconds a generated IAM token is kept in the cache before a new one is generated. The token itself is valid for 15 minutes, and a cached token is never used within 60 seconds of that expiry, so values of `840.0` and above will all have their tokens refetched at the `840` mark. The token cache is shared by every connection in the process, and its lifetime is set by the first connection that uses the IAM plugin; later connections that set a different value use the first connection's value. A value greater than `870.0` or less than or equal to `0` is rejected."
        spellings:
          ruby: { name: iam_expiration_sec, type: float, required: "No", default: "870.0", unit: s, example: "600.0 (maximum 870.0)" }
      - concept: iamTokenProperty
        type: symbol
        description: "The connection property name the generated token is injected into. Some underlying drivers require a specific property name for the token."
        spellings:
          ruby: { name: iam_access_token_property_name, required: "No", default: ":password", example: ":password" }
      - concept: awsCredentialsProvider
        type: object
        availability: { ruby: true }
        description: "A custom AWS credentials provider instance. One property is read by every plugin that calls AWS — IAM authentication, Secrets Manager, KMS encryption and custom endpoint — so setting it once covers all of them. When unset, each falls back to the AWS SDK default credential provider chain."
        spellings:
          ruby: { name: aws_credentials_provider, required: "No", defaultNote: "SDK default chain", example: "Aws::AssumeRoleCredentials.new(...)" }
    globalDatabases: |
      When using IAM authentication with
      [Amazon Aurora Global Databases](https://aws.amazon.com/rds/aurora/global-database/),
      the IAM user or role requires the additional `rds:DescribeGlobalClusters`
      permission so the token-generation path can resolve the writer region.

      ```json
      {
          "Version": "2012-10-17",
          "Statement": [
              {
                  "Effect": "Allow",
                  "Action": [
                      "rds-db:connect",
                      "rds:DescribeGlobalClusters"
                  ],
                  "Resource": "*"
              }
          ]
      }
      ```

      When you connect through an **Aurora Global Database endpoint**, also enable the
      [Initial Connection Strategy plugin](./initial-connection-strategy) (`initial_connection`).
      A global endpoint carries no region and points at whichever regional cluster is
      currently the primary, so the plugin resolves it to the actual writer instance
      before the IAM token is generated — without it, the token may be minted for the
      wrong host or region. This applies specifically to the global endpoint; when you
      connect through a regular regional cluster endpoint (writer, reader, or custom) the
      region is already part of the hostname and IAM works without `initial_connection`.
    prereqCount:
      ruby: 3
    wrapperOnly:
      ruby:
        - |
          ## Prerequisites

          :::warning
          To use this plugin, add `aws-sdk-rds` to your Gemfile:

          ```ruby
          gem 'aws-sdk-rds'
          ```
          :::

          :::warning
          To use this plugin, you must provide valid AWS credentials through the AWS
          SDK credential provider chain. Temporary credentials (AWS STS, IAM roles,
          SSO) expire, so ensure your provider refreshes them before they lapse to
          avoid authentication failures. For more information, see the
          [AWS credentials documentation](https://docs.aws.amazon.com/sdk-for-ruby/v3/developer-guide/setup-config.html).
          :::

          Then enable IAM database authentication on your RDS or Aurora instance,
          create an [IAM policy](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.IAMPolicy.html)
          granting `rds-db:connect`, and create a database account mapped to IAM:

          - MySQL: `CREATE USER iam_user IDENTIFIED WITH AWSAuthenticationPlugin AS 'RDS';`
          - PostgreSQL: `CREATE USER iam_user; GRANT rds_iam TO iam_user;`
        - |
          ## Use TLS/SSL with IAM authentication

          :::warning
          It is strongly recommended to use a **TLS/SSL 1.2+ connection** with IAM
          database authentication. IAM tokens are sent as passwords, and SSL ensures
          they are encrypted in transit.
          :::

          **MySQL (`mysql2`):**

          ```ruby
          AwsAdvancedRubyDriverWrapper::WrapperMysql2Client.new(
            host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
            username: "iam_user",
            wrapper_plugins: "iam",
            enable_cleartext_plugin: true,
            sslca: "/path/to/global-bundle.pem",
            ssl_mode: "verify_identity"
          )
          ```

          **PostgreSQL (`pg`):**

          ```ruby
          AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
            host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
            user: "iam_user",
            wrapper_plugins: "iam",
            sslmode: "verify-full",
            sslrootcert: "/path/to/global-bundle.pem"
          )
          ```

          When connecting directly to an RDS or Aurora endpoint, use the AWS global
          certificate bundle from the
          [RDS SSL/TLS documentation](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.SSL.html).

          If you connect through something that is not an RDS endpoint — a proxy, or your
          own domain name — two things change together. Set `iam_host` to a valid Amazon
          RDS endpoint so the token is generated for the right host, and supply the
          certificate authority appropriate for the endpoint you are *connecting* to
          rather than the one you are generating the token for.

          For the full picture, including what the wrapper does and does not enforce, see
          [Configuring TLS/SSL](../configuring-tls).
        - |
          ## MySQL requires the cleartext plugin

          :::caution
          **MySQL requires `enable_cleartext_plugin: true`.** RDS/Aurora MySQL IAM
          authentication relies on the MySQL `mysql_clear_password` client plugin,
          because the IAM token must be sent to the server in cleartext. The wrapper
          does **not** set this for you, so pass `enable_cleartext_plugin: true` when
          using the plugin with MySQL. Because the token is sent in cleartext, you
          must also use a TLS/SSL connection so it is encrypted in transit. This does
          not apply to PostgreSQL (`pg`).
          :::
        - |
          ## Token caching

          The plugin caches generated tokens keyed by region, host, port, user, and the
          identity of the AWS credentials that signed the token, so connections using
          different credentials never share a token, and a credentials provider that
          refreshes to a new access key gets a new token. When the credentials provider
          resolves to no credentials, the token is not cached.

          A cached token is reused until `iam_expiration_sec` elapses or until 60
          seconds before the token's own 15-minute expiry, whichever comes first. If a
          login error occurs with a cached token, the plugin automatically fetches a
          fresh token and retries the connection once.

          :::note
          The token cache is shared by every connection in the process, and the first
          connection that uses the IAM plugin sets its `iam_expiration_sec`. Connections
          opened later with a different value still use the first connection's value, so
          set `iam_expiration_sec` to the same value on every connection.
          :::

          ## Related

          - [AWS Credentials](../aws-credentials) — the plugin calls RDS to generate each
            token, so it needs credentials the SDK can refresh.
          - [Configuring TLS/SSL](../configuring-tls) — the token is sent as the password,
            and on MySQL it is sent in cleartext.

  # =========================================================================
  # AWS Secrets Manager Plugin
  # =========================================================================
  aws-secrets-manager:
    availableWrappers: [ruby]
    intro: |
      The AWS Secrets Manager Plugin allows connections to use database credentials
      stored as secrets in [AWS Secrets Manager](https://aws.amazon.com/secrets-manager/).
      When a new connection is created with this plugin enabled, the plugin
      retrieves the secret and creates the connection with the credentials inside
      it.
    code:
      ruby: secrets_manager
    pluginGroup: auth
    availableSince:
      ruby: "1.0.0"
    secretData: |
      The secret stored in AWS Secrets Manager should be a JSON object containing
      the `username` and `password` keys. If the secret uses different key names,
      specify them with the username and password key parameters.

      A Secret ARN has the format
      `arn:aws:secretsmanager:<Region>:<AccountId>:secret:SecretName-6RandomCharacters`.
    enableSnippet:
      ruby: |
        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
          dbname: "mydb",
          wrapper_plugins: "secrets_manager",
          secret_id: "my-db-secret",
          secret_region: "us-east-1"
        )
    parameters:
      - concept: secretId
        type: string
        description: "The name or ARN of the secret to retrieve."
        spellings:
          ruby: { name: secret_id,              required: "Yes", defaultNote: "none", example: "my-db-secret" }
      - concept: secretRegion
        type: string
        description: "The AWS region the secret is in. When the secret id is an ARN, the region is parsed from it automatically."
        spellings:
          ruby: { name: secret_region,        required: "Yes, unless the secret id is an ARN", defaultNote: "none", example: "us-east-1" }
      - concept: secretEndpoint
        type: string
        description: "Endpoint URL override used to retrieve the secret. Must include a valid protocol (for example `http://`) and domain. A port is not required."
        spellings:
          ruby: { name: secret_endpoint,        required: "No", defaultNote: "none", example: "http://localhost:1234" }
      - concept: secretExpiration
        type: integer
        description: "Time in seconds that secrets are cached before being re-fetched. When the credentials have a bounded lifetime (for example a rotation schedule), keep this comfortably below that lifetime — roughly 30 seconds less — so a rotated secret is picked up before the cached copy goes stale. Values outside `300.0`–`1140.0` are clamped into that range, with a warning logged."
        spellings:
          ruby: { name: secret_expiration_sec,           type: float, required: "No", default: "870.0", unit: s, example: "600.0 (300.0 to 1140.0)" }
      - concept: secretUsernameKey
        type: string
        description: "The key in the JSON secret that contains the username for the database connection."
        spellings:
          ruby: { name: secret_username_key,                  required: "No", default: "username", example: "writerUsername" }
      - concept: secretPasswordKey
        type: string
        description: "The key in the JSON secret that contains the password for the database connection."
        spellings:
          ruby: { name: secret_password_key,                  required: "No", default: "password", example: "readerPassword" }
      - concept: awsCredentialsProvider
        type: object
        availability: { ruby: true }
        description: "A custom AWS credentials provider instance. One property is read by every plugin that calls AWS — IAM authentication, Secrets Manager, KMS encryption and custom endpoint — so setting it once covers all of them. When unset, each falls back to the AWS SDK default credential provider chain."
        spellings:
          ruby: { name: aws_credentials_provider, required: "No", defaultNote: "SDK default chain", example: "Aws::AssumeRoleCredentials.new(...)" }
      - concept: secretRetryTimeout
        type: long
        availability: { ruby: true }
        description: "Time budget for the exponential-backoff retry loop used to bridge an in-progress secret rotation, re-fetching the credentials before each retry. `0` (the default) disables this timed retry loop; the plugin still performs a single forced re-fetch and one retry when a connection fails to authenticate with the cached secret."
        spellings:
          ruby: { name: secret_rotation_retry_timeout_sec,   type: float, required: "No", default: "0.0", unit: s, example: "30.0" }
      - concept: secretRetryInterval
        type: long
        availability: { ruby: true }
        description: "Initial delay before a failed connection is retried. The delay grows exponentially between attempts. Only used when the retry timeout is greater than `0`."
        spellings:
          ruby: { name: secret_rotation_retry_base_delay_sec, type: float, required: "No", default: "0.5",  unit: s, example: "1.0" }
    prereqCount:
      ruby: 1
    wrapperOnly:
      ruby:
        - |
          ## Prerequisites

          :::warning
          To use this plugin, add `aws-sdk-secretsmanager` to your Gemfile:

          ```ruby
          gem 'aws-sdk-secretsmanager'
          ```
          :::

          :::warning
          To use this plugin, you must provide valid AWS credentials through the AWS
          SDK credential provider chain. Temporary credentials (AWS STS, IAM roles,
          SSO) expire, so ensure your provider refreshes them, monitor expiration in
          production, and handle credential-related failures.
          :::

          See [AWS Credentials](../aws-credentials) for which credential sources the SDK
          refreshes automatically and which it does not.
        - |
          ## Secret caching

          Retrieved secrets are cached and shared by every connection in the process that
          reads the same secret the same way: the cache key combines `secret_id`, the
          region, `secret_endpoint`, and the identity of the AWS credentials used. Connections
          that differ in any of these do not share a cached secret or an in-flight fetch.
          When the credentials provider resolves to no credentials, the secret is fetched
          on every connection and not cached.

          ## Secret rotation

          AWS Secrets Manager does not require credential rotation, and the wrapper does
          not enforce it. We recommend enabling
          [automatic rotation](https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html)
          anyway, so that credentials change on a schedule and a leaked secret has a
          bounded lifetime.

          The plugin is built to keep working across a rotation:

          - Retrieved credentials are cached for `secret_expiration_sec` (`870.0` seconds by
            default) and then re-fetched, so a rotated secret is picked up on its own once
            the cache entry expires. The first connection after expiry still uses the
            cached credentials while the plugin re-fetches the secret in the background,
            and a cached secret is removed for good 20 minutes after it was fetched.
          - If a connection fails to authenticate with the cached credentials, the plugin
            forces an immediate re-fetch and retries once. This happens regardless of
            `secret_rotation_retry_timeout_sec` and covers the common case where the
            rotation happened between two connections.
          - For the brief window while a rotation is actually in progress, set
            `secret_rotation_retry_timeout_sec` to a non-zero value and the plugin instead
            re-fetches and reconnects repeatedly with exponential backoff — tunable through
            `secret_rotation_retry_base_delay_sec` — until login succeeds or the time
            budget is exhausted. This bridges the gap until the newly rotated credentials
            become valid. The default of `0` disables this timed loop, leaving the single
            forced re-fetch and retry described above.

          ## Related

          - [Configuring TLS/SSL](../configuring-tls) — the retrieved password travels over
            the connection like any other password, so verify the server and encrypt the
            traffic.
          - [AWS Credentials](../aws-credentials) — what this plugin needs in order to call
            Secrets Manager.

  # =========================================================================
  # KMS Encryption Plugin
  # =========================================================================
  kms-encryption:
    availableWrappers: [ruby]
    intro: |
      The KMS Encryption Plugin provides transparent client-side, column-level
      encryption using [AWS Key Management Service (KMS)](https://aws.amazon.com/kms/).
      It encrypts sensitive column values before they are stored in the database and
      decrypts them when they are read back, based on metadata configured in the
      database rather than in application code. The plaintext never reaches the
      server, and neither does any data key: only a KMS-encrypted copy of each data
      key is stored.

      :::warning
      **A database-side HMAC-validation trigger is required on every encrypted
      column.** On its own, the plugin cannot guarantee that an encrypted column never
      holds a plaintext value — it only sees statements sent over a connection with the
      plugin enabled, and it identifies encrypted columns by best-effort SQL parsing.
      The server-side trigger, not the SQL parser, is what guarantees an encrypted
      column never holds plaintext. See [Server-side enforcement is required](#server-side-enforcement-is-required)
      and [Enforce encryption in the database](#enforce-encryption-in-the-database) below.
      :::
    code:
      ruby: kms_encryption
    availableSince:
      ruby: "1.0.0"
    enableSnippet:
      ruby: |
        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
          dbname: "mydb",
          wrapper_plugins: "kms_encryption",
          encryption_kms_region: "us-east-1",
          encryption_allowed_master_key_arns: "arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab",
          encryption_audit_logging_enabled: true
        )
    parameters:
      - concept: kmsRegion
        type: string
        description: "AWS region for KMS encryption operations. When unset, the `AWS_REGION` and then the `AWS_DEFAULT_REGION` environment variable is used; if none of the three is set, the connection is rejected."
        spellings:
          ruby: { name: encryption_kms_region, required: "Yes, unless AWS_REGION or AWS_DEFAULT_REGION is set", defaultNote: "AWS_REGION, then AWS_DEFAULT_REGION env var", example: "us-east-1" }
      - concept: kmsEndpoint
        type: string
        availability: { ruby: true }
        description: "Endpoint URL override for KMS."
        spellings:
          ruby: { name: encryption_kms_endpoint, required: "No", defaultNote: "none", example: "http://localhost:4566" }
      - concept: allowedMasterKeys
        type: string
        availability: { ruby: true }
        description: "The KMS master keys the plugin may use, as a comma-separated string or an array. The plugin refuses to start without it. Each entry must match a `key_storage.master_key_arn` value exactly (the same ARN, alias, or key id that was used to set up the column). A data key that names any other master key, or none, is refused before KMS is called. See [Restrict the KMS keys the application can use](#restrict-the-kms-keys-the-application-can-use)."
        spellings:
          ruby: { name: encryption_allowed_master_key_arns, required: "Yes", defaultNote: "none", example: "arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab" }
      - concept: metadataSchema
        type: string
        description: "Schema (or database, on MySQL) holding the `encryption_metadata` and `key_storage` tables."
        spellings:
          ruby: { name: encryption_metadata_schema, required: "No", default: "encrypt", example: "app_encrypt" }
      - concept: metadataCacheEnabled
        type: boolean
        description: "Cache the encryption metadata in memory. Leave enabled in production; when disabled, a short-lived metadata connection is opened for every statement that touches an encrypted column. If you need fresher metadata, lower `encryption_metadata_cache_refresh_interval_sec` rather than disabling the cache."
        spellings:
          ruby: { name: encryption_metadata_cache_enabled, required: "No", default: "true", example: "true" }
      - concept: metadataCacheExpiration
        type: integer
        description: "How long cached encryption metadata stays valid."
        spellings:
          ruby: { name: encryption_metadata_cache_expiration_sec, type: float, required: "No", default: "3600.0", unit: s, example: "600.0" }
      - concept: metadataCacheRefresh
        type: integer
        description: "How often the encryption metadata is refreshed in the background. Set to `0` to disable background refresh."
        spellings:
          ruby: { name: encryption_metadata_cache_refresh_interval_sec, type: float, required: "No", default: "300.0", unit: s, example: "60.0" }
      - concept: dataKeyCacheEnabled
        type: boolean
        description: "Cache decrypted data keys in memory. Leave enabled in production; when disabled, a KMS `Decrypt` call is made for every statement that touches an encrypted column, which adds latency and cost and can hit KMS request-rate limits. Disabling it does shorten how long a plaintext data key stays in memory, so treat it as a deliberate trade-off between throughput and key exposure."
        spellings:
          ruby: { name: encryption_data_key_cache_enabled, required: "No", default: "true", example: "true" }
      - concept: dataKeyCacheMaxSize
        type: integer
        description: "Maximum number of decrypted data keys held in memory."
        spellings:
          ruby: { name: encryption_data_key_cache_max_size, required: "No", default: "1000", example: "100" }
      - concept: dataKeyCacheExpiration
        type: integer
        description: "How long a decrypted data key stays cached."
        spellings:
          ruby: { name: encryption_data_key_cache_expiration_sec, type: float, required: "No", default: "300.0", unit: s, example: "600.0" }
      - concept: keyMgmtMaxRetries
        type: integer
        description: "Maximum number of retries for throttled or failed key-management (KMS) operations."
        spellings:
          ruby: { name: encryption_key_management_max_retries, required: "No", default: "3", example: "5" }
      - concept: keyMgmtBackoff
        type: integer
        description: "Base delay for the exponential backoff between key-management (KMS) retries."
        spellings:
          ruby: { name: encryption_key_management_retry_backoff_base_sec, type: float, required: "No", default: "0.1", unit: s, example: "0.25" }
      - concept: auditLogging
        type: boolean
        description: "Log an audit record for every key-management, encryption, and decryption operation."
        spellings:
          ruby: { name: encryption_audit_logging_enabled, required: "No", default: "false", example: "true" }
      - concept: awsCredentialsProvider
        type: object
        availability: { ruby: true }
        description: "A custom AWS credentials provider instance. One property is read by every plugin that calls AWS — IAM authentication, Secrets Manager, KMS encryption and custom endpoint — so setting it once covers all of them. When unset, each falls back to the AWS SDK default credential provider chain."
        spellings:
          ruby: { name: aws_credentials_provider, required: "No", defaultNote: "SDK default chain", example: "Aws::AssumeRoleCredentials.new(...)" }
      - concept: returnUnverified
        type: boolean
        availability: { ruby: true }
        description: "**Do not enable in production.** On read, return a value as stored when it cannot be confirmed to be this column's encrypted data instead of raising. Intended only for reading data written before the column was encrypted."
        spellings:
          ruby: { name: encryption_return_unverified_data, required: "No", default: "false", example: "false" }
    adminUtility:
      ruby: "Plugins::Encryption::KeyManagementUtility"
    # The trigger SQL lives in the Ruby wrapper repo, which installs it in its integration tests:
    # lib/aws_advanced_ruby_driver_wrapper/plugins/kms_encryption/sql/trigger_pg.sql and
    # trigger_mysql.sql. This page links to those files rather than copying them. When a file
    # changes, bump the version in its database comment and add a row to "Updating the trigger SQL".
    serverSideEnforcement: |
      ## Enforce encryption in the database

      A database-side HMAC-validation trigger is required on every encrypted
      column. The trigger needs no help from the application, because the HMAC key
      that signs each value is stored unencrypted in `key_storage`: the server can
      verify that a value carries a valid integrity tag without holding the data
      key.

      The trigger SQL is maintained in the wrapper repository:

      - PostgreSQL: [`trigger_pg.sql`](https://github.com/aws/aws-advanced-ruby-driver-wrapper/blob/main/lib/aws_advanced_ruby_driver_wrapper/plugins/kms_encryption/sql/trigger_pg.sql)
      - MySQL: [`trigger_mysql.sql`](https://github.com/aws/aws-advanced-ruby-driver-wrapper/blob/main/lib/aws_advanced_ruby_driver_wrapper/plugins/kms_encryption/sql/trigger_mysql.sql)

      Run the file for your engine once per database, then add a trigger for every
      encrypted column as shown below. The SQL is updated from time to time; see
      [Updating the trigger SQL](#updating-the-trigger-sql).

      ### PostgreSQL

      Run [`trigger_pg.sql`](https://github.com/aws/aws-advanced-ruby-driver-wrapper/blob/main/lib/aws_advanced_ruby_driver_wrapper/plugins/kms_encryption/sql/trigger_pg.sql). It installs the `pgcrypto`
      extension if it is not already installed, and creates the
      `enforce_encrypted_column()` trigger function. The function reads the
      metadata tables as `encrypt.encryption_metadata` and `encrypt.key_storage`:
      replace `encrypt` if `encryption_metadata_schema` is set to something else. If
      `pgcrypto` is already installed in a schema other than `public`, replace
      `public` in `public.hmac` with that schema.

      Then create a trigger for every column that you want to encrypt:

      ```sql
      -- Create the trigger for every column that you want to encrypt.
      CREATE TRIGGER users_ssn_encrypted
      BEFORE INSERT OR UPDATE ON users
      FOR EACH ROW EXECUTE FUNCTION enforce_encrypted_column('ssn');

      -- Create the trigger for another column.
      CREATE TRIGGER users_dob_encrypted
      BEFORE INSERT OR UPDATE ON users
      FOR EACH ROW EXECUTE FUNCTION enforce_encrypted_column('dob');
      ```

      ### MySQL

      MySQL has no built-in HMAC function, so
      [`trigger_mysql.sql`](https://github.com/aws/aws-advanced-ruby-driver-wrapper/blob/main/lib/aws_advanced_ruby_driver_wrapper/plugins/kms_encryption/sql/trigger_mysql.sql) builds HMAC-SHA256 out of
      `SHA2()`. Run it once per schema to create the two functions and the two
      validation procedures, then add a `BEFORE INSERT` and a `BEFORE UPDATE`
      trigger per encrypted column. Replace `SCHEMA_NAME` in the file with the value
      of `encryption_metadata_schema` (`encrypt` by default). Requires MySQL 5.7+ /
      MariaDB 10.2+ for `SHA2()`. On Aurora/RDS MySQL, creating the functions may
      require the cluster parameter `log_bin_trust_function_creators` to be set to
      `1`.

      :::note
      The file and the trigger SQL below use `DELIMITER`, which is a command of the
      `mysql` command-line client rather than SQL. To run them through a driver, a
      Rails migration, or any other tool that sends one statement at a time, leave
      out the `DELIMITER` lines and send each `DROP`, `CREATE FUNCTION`,
      `CREATE PROCEDURE` and `CREATE TRIGGER` statement on its own, without its
      trailing `$$`.
      :::

      Then create a pair of triggers for every column that you want to encrypt. For
      example, on `users.ssn`:

      ```sql
      DELIMITER $$
      -- Create both triggers for every column that you want to encrypt.
      CREATE TRIGGER users_ssn_hmac_check
      BEFORE INSERT ON users
      FOR EACH ROW
      BEGIN
          CALL validate_encrypted_data_hmac_before_insert('users', 'ssn', NEW.ssn);
      END$$

      CREATE TRIGGER users_ssn_hmac_check_update
      BEFORE UPDATE ON users
      FOR EACH ROW
      BEGIN
          CALL validate_encrypted_data_hmac_before_update('users', 'ssn', NEW.ssn, OLD.ssn);
      END$$

      -- Repeat the pair for another column, e.g. users.dob.
      CREATE TRIGGER users_dob_hmac_check
      BEFORE INSERT ON users
      FOR EACH ROW
      BEGIN
          CALL validate_encrypted_data_hmac_before_insert('users', 'dob', NEW.dob);
      END$$

      CREATE TRIGGER users_dob_hmac_check_update
      BEFORE UPDATE ON users
      FOR EACH ROW
      BEGIN
          CALL validate_encrypted_data_hmac_before_update('users', 'dob', NEW.dob, OLD.dob);
      END$$
      DELIMITER ;
      ```

      ### Updates after a key rotation

      Both triggers check a value against the column's **current** HMAC key, and
      rotating a column's data key also gives it a new HMAC key. Values written
      before the rotation keep the previous key's HMAC tag, which is still valid
      for them: the plugin reads them with the key they were written with.

      So the triggers skip the check when an `UPDATE` leaves the encrypted value
      unchanged. Without that, every update to a row written before the rotation,
      even one that only changes another column, would be rejected until the row's
      encrypted values were re-encrypted. A value that is new to the row - an
      `INSERT`, or an `UPDATE` that changes the encrypted column - is still
      checked, and must carry the current key's tag. The plugin always writes new
      values with the current key, so its writes pass.

      ### Updating the trigger SQL

      The trigger SQL changes from time to time, independently of the wrapper
      version. A database keeps the version it was set up with until the file is
      run again, so re-run the file for your engine when a newer version is listed
      below. Re-running it replaces the functions and procedures without changing
      any data, and the per-column triggers keep working without being re-created.
      On MySQL the file drops and re-creates each routine, so a write to an
      encrypted column can fail in the moment between the two: re-run it while
      writes are quiet.

      Each file records its version in a database comment. To check the version a
      database has:

      ```sql
      -- PostgreSQL
      SELECT obj_description('enforce_encrypted_column'::regproc, 'pg_proc');
      ```

      ```sql
      -- MySQL, in the schema the procedures were created in
      SELECT ROUTINE_COMMENT FROM information_schema.ROUTINES
       WHERE ROUTINE_SCHEMA = DATABASE()
         AND ROUTINE_NAME = 'validate_encrypted_data_hmac_before_insert';
      ```

      An empty result means the SQL was installed before versions were recorded.

      | Engine | Version | Change | If your database has an earlier version |
      |---|---|---|---|
      | PostgreSQL | v2 | Reads the column's HMAC key from `key_storage` for every row. | Re-run `trigger_pg.sql`. An empty result is an earlier version. |
      | MySQL | v1 | Records the version. The SQL is otherwise unchanged. | No action needed. An empty result is equivalent to v1. |
    hardening: |
      ## Hardening the deployment

      Three access-control boundaries do most of the work of keeping the encryption
      meaningful: which KMS keys the application can reach, who can write the
      metadata schema, and who can change the server-side trigger.

      ### Restrict the KMS keys the application can use

      The plugin does not take the master key for a column from its own
      configuration: it reads it from the column's `key_storage` row and asks KMS
      to decrypt the data key under it. Two independent controls keep a changed row
      from pointing the plugin at a key it should not use.

      **List the permitted master keys in `encryption_allowed_master_key_arns`.**
      This property is required. Before every KMS call, the plugin checks the
      master key named by `key_storage` against the list. A key that is not listed,
      or a row that names no key, is refused with an `Errors::KeyManagementError`
      (code `KEY07`), and KMS is never called. The refusal applies to reads and
      writes alike, and `encryption_return_unverified_data` does not bypass it. The
      comparison is exact, so list each key in the same form (ARN, alias, or key
      id) that was passed to `{{ADMIN_UTILITY}}` when the column was set up. Add a
      new master key to the list before rotating a column onto it, or the
      application will refuse that column until the list is updated. Keep the old
      master key listed, and allowed `kms:Decrypt` in the application's IAM
      policy, until every value written before the rotation has been re-encrypted:
      those values are still wrapped under the old key, and reading one fails
      with `KEY07` once that key is removed from the list.
      `{{ADMIN_UTILITY}}` does not require the property, so a script can create a
      master key and use it straight away, but it enforces the list when one is
      configured. Without the list, `rotate_data_key` must be passed the master key
      to rotate onto: keeping the current one would mean trusting whatever ARN
      `key_storage` holds.

      **Scope the application's IAM permissions to the same keys.** Grant the
      credentials the plugin runs under only the KMS actions they need, on the
      specific master key ARN(s) the columns use - never `Resource: "*"`. Use a
      distinct key per environment. This also blocks a key in another AWS
      account: using one requires permission in your own account's policy as
      well as in that key's policy.

      At runtime the plugin only decrypts stored data keys, so the application's
      role needs just `kms:Decrypt` on those keys:

      ```json
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": "kms:Decrypt",
            "Resource": "arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab"
          }
        ]
      }
      ```

      The administrative side (`{{ADMIN_UTILITY}}`: creating master keys, turning
      encryption on for a column, rotating data keys) additionally calls
      `kms:GenerateDataKey`, `kms:CreateKey`, `kms:CreateAlias`, and
      `kms:DescribeKey`. Run it under a separate, admin-only credential rather than
      granting those actions to the application's runtime role.

      Do not add a `kms:ViaService` condition to these policies. That condition
      only matches requests an AWS service makes to KMS on your behalf, and the
      plugin calls KMS directly from the application, so every `Decrypt` would be
      denied.

      ### Restrict write access to the metadata schema

      `encryption_metadata` records which columns are encrypted, and `key_storage`
      holds each column's KMS-encrypted data key alongside its HMAC key (in the
      clear). Anyone who can **write** those tables can defeat the protection:
      substituting a known HMAC key lets them forge values that pass the
      server-side trigger. Repointing a column at a master key they control is
      refused by `encryption_allowed_master_key_arns`, but they can still delete or
      swap the key material of listed keys and make a column unreadable. Whether the
      column holds only ciphertext is only as strong as who can change
      `key_storage`.

      At runtime the plugin only reads the metadata schema, so grant the
      application's database role `SELECT` on it and nothing more. Reserve
      `INSERT`/`UPDATE`/`DELETE` for the administrative role that runs
      `{{ADMIN_UTILITY}}`.

      ```sql
      -- PostgreSQL
      GRANT USAGE ON SCHEMA encrypt TO app_role;
      GRANT SELECT ON ALL TABLES IN SCHEMA encrypt TO app_role;
      REVOKE INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA encrypt FROM app_role;
      ```

      ```sql
      -- MySQL (the encrypt schema is a database)
      GRANT SELECT ON encrypt.* TO 'app_user'@'%';
      -- grant INSERT/UPDATE/DELETE on encrypt.* only to the administrative user
      ```

      The application's role does still need `SELECT` on `key_storage`, both to
      read key material and because the server-side trigger reads the HMAC key as
      the invoking user.

      ### Keep the application from turning off the trigger

      The server-side trigger only protects a column while it stays in place and
      unchanged. Some roles can switch it off, or get around it, without touching the
      metadata schema:

      - **The owner of a table** can disable or drop its triggers. On PostgreSQL,
        `ALTER TABLE users DISABLE TRIGGER users_ssn_encrypted` turns the check off
        and needs no other privilege.
      - **A role with the `TRIGGER` privilege on a table** can add a trigger of its
        own. One that runs after the HMAC check can replace the checked value with
        plaintext. PostgreSQL runs `BEFORE` triggers in name order, and MySQL in
        creation order unless `FOLLOWS` or `PRECEDES` is given. On MySQL the same
        privilege also allows `DROP TRIGGER`.
      - **The owner of the trigger function** on PostgreSQL, or **a user with
        `ALTER ROUTINE` on the validation routines** on MySQL, can replace them with
        versions that accept any value. On MySQL, the user that creates a routine is
        given `ALTER ROUTINE` on it automatically.
      - **A superuser**, including the RDS master user (`rds_superuser` on RDS for
        PostgreSQL), can do all of the above. On PostgreSQL it can also skip triggers
        for a whole session with `SET session_replication_role = replica`.

      So create the encrypted tables, the trigger function or routines, and the
      triggers as an administrative role, and give the application's role only the
      data privileges it needs on those tables. Do not run the application as the
      master user. With ActiveRecord this means running migrations under a different
      role from the application, because the role that runs `CREATE TABLE` owns the
      table it creates.

      ```sql
      -- PostgreSQL: the administrative role owns the table, and the application role can only use it.
      GRANT SELECT, INSERT, UPDATE, DELETE ON users TO app_role;
      GRANT USAGE ON SEQUENCE users_id_seq TO app_role;
      ```

      ```sql
      -- MySQL: grant data privileges only, not TRIGGER or ALTER ROUTINE.
      GRANT SELECT, INSERT, UPDATE, DELETE ON mydb.users TO 'app_user'@'%';
      ```

      ### Encrypted values are not tied to their row

      Each stored value is checked against its column's keys: its HMAC tag and its
      AES-GCM authentication tag must both verify before it is decrypted. Nothing in
      the value identifies the row it belongs to, though. An encrypted value copied
      from one row into another row of the **same column** still verifies, is
      accepted by the server-side trigger, and decrypts normally.

      So anyone who can `UPDATE` a table with encrypted columns can move encrypted
      values between its rows without holding any key. For example, they could copy
      another user's encrypted SSN into their own row and then read it through the
      application in plaintext, or overwrite a value with an older one. This
      includes the application's own database role, and so any SQL injection in
      the application. Moving a value into a **different** column does not work:
      each column has its own data key and HMAC key (as `{{ADMIN_UTILITY}}` sets
      up), so the server-side trigger refuses the write.

      To limit the exposure:

      - Grant `UPDATE` on tables with encrypted columns only to the roles that
        need it, and treat that privilege as sensitive.
      - Keep SQL injection out of the application. Binding values, which the plugin
        already requires for writes to encrypted columns, does most of this.
      - Where a value must provably belong to its row, have the application tie them
        together itself. For example, write the row's key as part of the value (such
        as `"#{user_id}:#{ssn}"`) and check it after reading.
    prereqCount:
      ruby: 1
    wrapperOnly:
      ruby:
        - |
          ## Prerequisites

          :::warning
          To use this plugin, add `aws-sdk-kms` to your Gemfile:

          ```ruby
          gem 'aws-sdk-kms'
          ```
          :::

          :::warning
          On PostgreSQL, this plugin also needs `pg_query`, which it uses to work out
          which bind parameters belong to encrypted columns. Add it to your Gemfile:

          ```ruby
          gem 'pg_query', '>= 5.1'
          ```

          If `pg_query` is missing, connections with the plugin enabled fail with a
          `LoadError` when they are set up. MySQL does not need `pg_query`.
          `pg_query` builds a C extension when it is installed, so the first install
          takes longer than for a pure-Ruby gem.
          :::

          :::warning
          To use this plugin, you must provide valid AWS credentials through the AWS
          SDK credential provider chain. Temporary credentials (AWS STS, IAM roles,
          SSO) expire, so ensure your provider refreshes them before they lapse.
          :::

          The plugin expects two tables in the schema named by
          `encryption_metadata_schema`: `encryption_metadata`, which records the
          encrypted columns, and `key_storage`, which holds each KMS-encrypted data
          key alongside the HMAC key that signs its values. Every encrypted column
          must be a binary column (`bytea` on PostgreSQL, `VARBINARY` or `BLOB` on
          MySQL). Manage columns and keys through
          `Plugins::Encryption::KeyManagementUtility` rather than editing the tables
          by hand; a column is only usable once a matching data key exists in
          `key_storage`.

          ### Create the metadata tables

          Create the schema and both tables once, before setting up any encrypted
          column. The statements below use the default schema name `encrypt`;
          replace it if `encryption_metadata_schema` is set to something else. On
          MySQL a schema is a database, so `CREATE SCHEMA` creates a database named
          `encrypt`.

          #### PostgreSQL

          ```sql
          CREATE SCHEMA IF NOT EXISTS encrypt;

          CREATE TABLE encrypt.key_storage (
              id SERIAL PRIMARY KEY,
              key_id VARCHAR(255) NOT NULL,
              name VARCHAR(255) NOT NULL,
              master_key_arn VARCHAR(512) NOT NULL,
              encrypted_data_key TEXT NOT NULL,
              hmac_key BYTEA NOT NULL,
              key_spec VARCHAR(50) DEFAULT 'AES_256',
              created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
              last_used_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE encrypt.encryption_metadata (
              table_name VARCHAR(255) NOT NULL,
              column_name VARCHAR(255) NOT NULL,
              encryption_algorithm VARCHAR(50) NOT NULL,
              key_id INTEGER NOT NULL,
              created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
              PRIMARY KEY (table_name, column_name),
              FOREIGN KEY (key_id) REFERENCES encrypt.key_storage(id)
          );
          ```

          #### MySQL

          ```sql
          CREATE SCHEMA IF NOT EXISTS encrypt;

          CREATE TABLE encrypt.key_storage (
              id INT AUTO_INCREMENT PRIMARY KEY,
              key_id VARCHAR(255) NOT NULL,
              name VARCHAR(255) NOT NULL,
              master_key_arn VARCHAR(512) NOT NULL,
              encrypted_data_key TEXT NOT NULL,
              hmac_key VARBINARY(32) NOT NULL,
              key_spec VARCHAR(50) DEFAULT 'AES_256',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              last_used_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE encrypt.encryption_metadata (
              table_name VARCHAR(255) NOT NULL,
              column_name VARCHAR(255) NOT NULL,
              encryption_algorithm VARCHAR(50) NOT NULL,
              key_id INT NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (table_name, column_name),
              FOREIGN KEY (key_id) REFERENCES encrypt.key_storage(id)
          );
          ```

          `encryption_metadata.key_id` references `key_storage.id`, not
          `key_storage.key_id`. Once the tables exist, create the database-side
          trigger described in [Enforce encryption in the database](#enforce-encryption-in-the-database),
          then use `Plugins::Encryption::KeyManagementUtility` to set up each column.

          ### Set up an encrypted column

          `KeyManagementUtility` runs on a plain `pg` or `mysql2` connection that you
          open and close yourself. Build its configuration from the same `encryption_*`
          parameters the plugin uses, then create a master key and turn on encryption
          for an existing binary column:

          ```ruby
          require "aws_advanced_ruby_driver_wrapper"
          require "aws-sdk-kms"
          require "pg"

          encryption = AwsAdvancedRubyDriverWrapper::Plugins::Encryption

          conn = PG.connect(host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com", dbname: "mydb",
                            user: "admin", password: "...")
          config = encryption::EncryptionConfig.from_props(encryption_kms_region: "us-east-1")
          utility = encryption::KeyManagementUtility.new(
            connection: conn, kms_client: Aws::KMS::Client.new(region: "us-east-1"), config: config
          )

          master_key_arn = utility.create_master_key("users.ssn encryption")
          utility.initialize_encryption_for_column("users", "ssn", master_key_arn)
          conn.close
          ```

          To use an existing KMS key instead of creating one, pass its ARN to
          `initialize_encryption_for_column`. Either way, add the ARN to
          `encryption_allowed_master_key_arns`, or the plugin refuses to read or
          write the column.

          :::warning
          `initialize_encryption_for_column` only generates the column's data key and
          records the column in `encryption_metadata`. It does **not** create the
          database-side HMAC-validation trigger. Create that trigger for every
          encrypted column yourself, as described in
          [Enforce encryption in the database](#enforce-encryption-in-the-database).
          Without it, a write that does not go through the plugin stores a plaintext
          value without any error.
          :::
        - |
          ## Server-side enforcement is required

          :::warning
          A database-side HMAC-validation trigger is **required** on every encrypted
          column to prevent plaintext writes, because the plugin alone cannot guarantee
          an encrypted column never holds a plaintext (see the intro above). The
          server-side trigger — not the plugin's SQL parsing — is what provides that
          guarantee. See [Enforce encryption in the database](#enforce-encryption-in-the-database)
          to set it up, and [Paths that are not covered](#paths-that-are-not-covered)
          for exactly where the plugin relies on it.
          :::
        - |
          ## Paths that are covered

          Encryption applies to **bind parameters**, so a value can be encrypted only
          when it is bound rather than written into the SQL text:

          ```ruby
          # pg
          conn.exec_params('INSERT INTO users (name, ssn) VALUES ($1, $2)', ['Jo', '123-45-6789'])
          conn.exec_params('SELECT ssn FROM users WHERE name = $1', ['Jo']).each { |row| row['ssn'] }

          # mysql2
          client.prepare('INSERT INTO users (name, ssn) VALUES (?, ?)').execute('Jo', '123-45-6789')
          ```

          :::caution
          **On MySQL with ActiveRecord, set `prepared_statements: true` on the
          connection.** The `aws_mysql2` adapter (like the underlying `mysql2`
          adapter) defaults prepared statements **off**, and with them off
          ActiveRecord writes a value into the SQL text as a literal rather than
          binding it. The plugin cannot encrypt a literal, so a write to an encrypted
          column is refused (`Errors::MetadataError`, see
          [Refused, so the plaintext is not stored](#refused-so-the-plaintext-is-not-stored)).
          Enable them in `database.yml` so values are bound and can be encrypted:

          ```yaml
          production:
            adapter: aws_mysql2
            prepared_statements: true
            # ...
          ```

          The `aws_postgresql` adapter already defaults prepared statements on, so
          PostgreSQL needs no change.

          Prepared statements are off by default on the mysql2 adapter for a reason,
          so weigh the trade-off before enabling them fleet-wide:

          - **Connection poolers/proxies.** Server-side prepared statements are bound
            to a specific backend connection. A pooler that multiplexes many clients
            onto fewer backends — Amazon RDS Proxy, ProxySQL, PgBouncer in transaction
            mode — may be unable to reuse them, which forces session pinning (defeating
            much of the pooling benefit) or surfaces `Unknown prepared statement
            handler` errors.
          - **Server statement limits.** Each prepared statement consumes a handle
            against MySQL's `max_prepared_stmt_count`; many long-lived pooled
            connections each preparing many distinct statements can exhaust it and
            start failing with `Can't create more than max_prepared_stmt_count
            statements`.

          If you cannot enable prepared statements, the plugin still cannot encrypt an
          inlined literal — scope the encrypted columns to writes you can issue as
          bound parameters (a raw prepared/`exec_params` statement, or an
          `/*@encrypt:table.column*/` annotation on a bound value), and rely on the
          required [server-side trigger](#enforce-encryption-in-the-database) to reject
          any plaintext that slips through.
          :::

          The following paths are covered:

          - Bind parameters of an `INSERT`, `UPDATE`, or `REPLACE` whose columns the
            plugin can read from the statement, including a multi-row `VALUES` list and
            the assignments of an upsert (`ON CONFLICT ... DO UPDATE` on PostgreSQL,
            `ON DUPLICATE KEY UPDATE` on MySQL). On PostgreSQL this also covers a
            `MERGE`'s `WHEN MATCHED ... UPDATE` / `WHEN NOT MATCHED ... INSERT` clauses
            and a data-modifying common table expression, for example
            `WITH w AS (INSERT INTO users (ssn) VALUES ($1) RETURNING id) SELECT * FROM w`.
          - Bind parameters compared against an encrypted column in a `WHERE` clause.
            Note that encryption is randomized, with a fresh IV per value, so the
            ciphertext differs every time and an equality search against an encrypted
            column will not match anything — it silently returns no rows rather than
            matching, and nothing leaks through deterministic ciphertext. In an
            ActiveRecord app the same applies to finders and validations that compare
            an encrypted column: `where(ssn: x)`, `find_by(ssn: x)`, and
            `validates_uniqueness_of :ssn` never match an existing row, so a uniqueness
            validation silently passes even when a duplicate exists. Filter, look up,
            and enforce uniqueness on a column that is not encrypted instead.
          - Statements run by name after being prepared, whether prepared by the
            driver's own `prepare` or by a `PREPARE` sent as a statement. A `PREPARE`
            is also checked as it is sent, so a plaintext written into the statement it
            carries is caught at that point.
          - Reads, however the rows come back. A row read as a hash is matched to its
            columns by name; a row read as a **bare array** of values is matched by
            position, using the column names the result reports — which is what lets
            **ActiveRecord** reads decrypt even though it fetches rows as arrays
            (mysql2 in `as: :array` mode, `PG::Result#values`). This covers
            `PG::Result#each`, `#each_row`, `#to_a`, `#[]`, `#values`, `#field_values`,
            `#column_values`, `#tuple`, `#tuple_values` and `#getvalue`, its
            single-row-mode `#stream_each`/`#stream_each_row`/`#stream_each_tuple`, and
            mysql2's hash and array results alike. A decrypted value is always returned
            as a **string**, whatever type it had when it was written: an encrypted
            column is a binary column (`bytea` or `VARBINARY`), and a string keeps the
            read consistent with the column's real type and with how ActiveRecord
            treats it. Cast the value on read when you need another type, for example
            `row['age'].to_i`. The one exception is `COPY ... TO`, whose rows are a
            stream rather than values the plugin can replace, so it hands back the
            stored payload as-is.
          - A column named explicitly with an annotation, which takes precedence over
            anything the parser found. This is the escape hatch for a statement the
            plugin cannot read:

            ```ruby
            conn.exec_params('INSERT INTO users (name, ssn) VALUES ($1, /*@encrypt:users.ssn*/ $2)', ...)
            ```

          The plugin treats reads and writes differently. A **read fails closed**: a
          value read from an encrypted column that does not verify — it is not a valid
          encrypted payload, or its integrity tag does not match — is refused with an
          `Errors::EncryptionError` rather than handed back, so the application never
          receives a value the wrapper cannot vouch for. A consequence worth noting: a
          value that reached an encrypted column outside the plugin, including data
          that predates the column being encrypted, will raise when read back through
          the plugin, so encrypt existing data before it is read through an encrypted
          column (or, only for a controlled migration, see
          [reading data written before encryption](#reading-data-written-before-encryption)).
          A **write** is the opposite — when the plugin cannot do its job it mostly
          stays out of the way and leaves the value to the
          [server-side enforcement](#enforce-encryption-in-the-database), which is what
          actually guarantees an encrypted column never holds a plaintext, with one
          exception: it **fails closed** and raises `Errors::MetadataError` when it can
          confirm a column is encrypted and sees the statement writing it with
          something other than a bind parameter, which cannot be encrypted and is
          almost always a mistake. Everything else on a write it cannot fully read, it
          passes through — see
          [paths that are not covered](#paths-that-are-not-covered).
        - |
          ## Reading data written before encryption

          When you enable encryption on a column that already holds plaintext, those
          existing rows are not encrypted payloads, so reading them back through the
          plugin fails closed and raises. The supported way to handle this is to
          **encrypt the existing data** (read each value and write it back through the
          plugin so it is stored encrypted) before the application reads the column
          normally.

          For a controlled migration where that is not yet possible,
          `encryption_return_unverified_data` (default `false`) makes the read
          **lenient**: a value that cannot be confirmed to be this column's encrypted
          data — too short to be a payload, or a failed HMAC — is returned exactly as
          the database holds it instead of raising, so legacy plaintext reads back
          untouched while genuinely encrypted values still decrypt.

          :::warning
          **Do not enable `encryption_return_unverified_data` in production.** It lets
          unverified data reach the application and removes the read path's tamper
          detection: a value that fails its integrity check can no longer be told apart
          from a value that was never encrypted, so a tampered or corrupted value is
          returned silently. Use it only for a bounded migration of pre-existing data,
          then turn it off. Even when it is enabled, a value that verifies but cannot
          be decrypted (a wrong or mismatched data key) still raises, because that
          indicates a real key fault rather than legacy plaintext.
          :::
        - |
          ## Paths that are not covered

          Only the required
          [server-side enforcement](#enforce-encryption-in-the-database) guarantees an
          encrypted column never holds a plaintext. The plugin encrypts what it can
          confidently identify and, apart from the one refusal below, leaves everything
          else to that enforcement rather than refusing statements it cannot fully
          read — which would reject legitimate statements that never touch an encrypted
          column.

          ### Refused, so the plaintext is not stored

          A write **raises `Errors::MetadataError`** in one case: the plugin can
          confirm a column is encrypted, but the statement writes it with something
          other than a bind parameter — a value in the SQL text, an expression around a
          parameter, a `DEFAULT`, or a `COPY ... FROM` that names the column. None of
          these can be encrypted, and it is almost always a mistake, so the write is
          refused with advice to bind the value (or, for a `COPY`, use `INSERT`). An
          annotation naming the column overrides this wherever there is a parameter for
          it to name, which a `COPY` does not have.

          ### Passed through, relying on the database

          When the plugin can see a statement writes but cannot establish which
          columns — so it cannot be sure an encrypted column is even involved — it lets
          the statement through and leaves any plaintext for the database to reject,
          rather than refusing a statement that may touch no encrypted column at all.
          This covers an `INSERT` that does not name its columns, an `INSERT` whose
          values come from a nested `SELECT`, an `UPDATE` naming more than one table
          (which of them an assignment belongs to cannot be established), a `MERGE`
          clause or data-modifying CTE whose written columns cannot be enumerated, a
          `COPY ... FROM` that names no columns, a statement prepared somewhere the
          connection could not read, a write the parser could not read at all, and any
          statement while the plugin's own metadata tables are unreadable. It is
          logged — at `warn` when the target table is known to have encrypted columns,
          at `debug` otherwise.

          A table or column name the plugin cannot read in the connection's encoding
          is also left to the database, and logged at `warn`; see
          [Character encodings](#character-encodings).

          ### Not seen at all, so a plaintext is stored silently

          :::warning
          On the paths below the plugin never sees the write at all, so a plaintext
          goes to the server and is stored, with nothing raised and nothing logged at
          write time. The server-side HMAC-validation trigger (see
          [enforce encryption in the database](#enforce-encryption-in-the-database)) is
          what stops these paths from storing a plaintext. Without the trigger the
          plaintext is stored; a later read of it through the plugin fails closed and
          raises, but a read that does not go through the plugin still returns it in
          the clear.
          :::

          - `LOAD DATA INFILE` on MySQL, and a `COPY ... FROM` whose statement text
            cannot be parsed.
          - Anything the server runs on the application's behalf: `CALL`, `DO`, a
            function, a stored routine, a trigger.
          - MySQL's `PREPARE stmt FROM '<statement text>'` together with
            `EXECUTE stmt USING @vars`, and SQL-level `EXECUTE` with inline literals:
            the values live in server-side variables the plugin never sees.
          - The second and later statements of a multi-statement string.
          - Everything that reaches the column without passing through a connection
            that has the plugin enabled: `psql` or the `mysql` client, a migration
            tool, another service, a wrapper connection whose `wrapper_plugins` does
            not include `kms_encryption`, and whatever was already in the table before
            the column was configured.
        - |
          ## Character encodings

          **String values** are encrypted as UTF-8 text, whatever encoding the Ruby
          string is in, and are always decrypted to a UTF-8 `String`. A UTF-16 or
          Latin-1 `"grün"` reads back as the UTF-8 `"grün"`. A binary (`ASCII-8BIT`) string is treated as raw bytes
          and reads back as binary. A string that has no UTF-8 form, for example
          because it contains bytes that are invalid in its encoding, is refused with
          `Errors::EncryptionError`. ActiveRecord passes the plugin binary strings
          unless the model says otherwise; see
          [Declare encrypted columns as strings in ActiveRecord](#declare-encrypted-columns-as-strings-in-activerecord).

          **SQL** can be in any encoding. The plugin reads a UTF-8 copy of each
          statement to find its encrypted columns, while the driver is sent the SQL
          exactly as your application wrote it.

          ### Declare encrypted columns as strings in ActiveRecord

          An encrypted column is a binary column, so by default ActiveRecord treats
          its attribute as binary. It writes the value as a binary (`ASCII-8BIT`)
          string and reads it back as one, so `"café"` reads back as
          `"caf\xC3\xA9"`. On PostgreSQL, ActiveRecord also runs
          `PG::Connection.unescape_bytea` over the decrypted value, which changes any
          value that contains a backslash: `"a\\b"` reads back as `"ab"`, and
          `"\\x41"` as `"A"`.

          Declare each encrypted column as a string attribute on its model:

          ```ruby
          class User < ApplicationRecord
            attribute :ssn, :string
          end
          ```

          ActiveRecord then writes and reads the value as a UTF-8 string, so
          `"café"`, `"a\\b"` and `"\\x41"` all read back exactly as they were
          written. The column itself stays binary; only the attribute's Ruby type
          changes.

          ### Known limitations

          Both limitations below need a table or column name that isn't plain ASCII.
          Encrypted tables and columns with ASCII names are unaffected.

          - **Names the connection's encoding can't be read in.** On a connection that
            isn't UTF-8, the plugin converts table and column names to UTF-8 to match
            them against the encryption metadata. Ruby can't convert every character of
            every encoding. For example, some characters of PostgreSQL's
            `SHIFT_JIS_2004` and `EUC_JIS_2004` can't be converted, and Ruby can't
            convert the `MULE_INTERNAL`, `EUC_TW`, `WIN1258` and `JOHAB` encodings at
            all. When a name contains such a character, the plugin can't tell whether
            its column is encrypted. It logs a warning, once for each name, and doesn't
            encrypt or decrypt that column:
            - A **write** is left to the [server-side trigger](#enforce-encryption-in-the-database),
              which rejects the plaintext value.
            - A **read** returns the stored encrypted bytes instead of the decrypted
              value.
          - **Binary SQL on a connection that isn't UTF-8.** A statement passed as a
            binary (`ASCII-8BIT`) string has no encoding of its own, so the plugin reads
            its bytes as UTF-8. On a connection in another encoding, a non-ASCII table
            or column name in such a statement can't be read, and it's handled as in the
            previous limitation.

          :::tip
          To avoid these limitations, use a UTF-8 connection (`client_encoding: 'UTF8'`
          on PostgreSQL, `encoding: 'utf8mb4'` on MySQL, which are the defaults for
          most setups), give encrypted tables and columns ASCII names, and pass SQL as
          strings tagged with their real encoding rather than as binary.
          :::

  # =========================================================================
  # Custom Endpoint Plugin
  # =========================================================================
  custom-endpoint:
    availableWrappers: [ruby]
    intro: |
      The Custom Endpoint Plugin adds support for
      [Aurora custom endpoints](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Custom.html).
      When the plugin is in use, the wrapper analyzes the custom endpoint's member
      list to ensure the instances used for connections are part of the custom
      endpoint being used, including connections used during failover. Use this
      plugin when your connection host is an Aurora cluster custom endpoint:
      `<custom-endpoint-name>.cluster-custom-<XYZ>.<region>.rds.amazonaws.com`.
    note: |
      An Aurora custom endpoint is a cluster endpoint with a user-defined member
      list, managed in RDS. It is **not** the same as a user custom domain (a CNAME
      alias pointing at an RDS endpoint), which is configured with the instance host
      pattern parameter instead.
    code:
      ruby: custom_endpoint
    availableSince:
      ruby: "1.0.0"
    enableSnippet:
      ruby: |
        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-endpoint.cluster-custom-xyz.us-east-1.rds.amazonaws.com",
          dbname: "mydb",
          wrapper_plugins: "custom_endpoint"
        )
    parameters:
      - concept: region
        type: string
        description: "The region of the cluster's custom endpoints, used for the RDS API calls that fetch the endpoint's members. Parsed from the custom endpoint hostname when not specified. The plugin only acts on Aurora custom endpoint hostnames (`.cluster-custom-`), so it has no effect for IP addresses or custom domains."
        spellings:
          ruby: { name: custom_endpoint_region, required: "No", defaultNote: "parsed from URL", example: "us-east-1" }
      - concept: refreshRate
        type: integer
        description: "How frequently custom endpoint monitors fetch custom endpoint info."
        spellings:
          ruby: { name: custom_endpoint_info_refresh_rate_sec, type: float, required: "No", default: "30.0", unit: s, example: "20.0" }
      - concept: backoffFactor
        type: integer
        description: "Exponential backoff factor for the custom endpoint monitor when it encounters an RDS throttling exception. The refresh interval increases by this factor on throttling and decreases by it on success."
        spellings:
          ruby: { name: custom_endpoint_info_refresh_rate_backoff_factor, required: "No", default: "2", example: "5" }
      - concept: maxRefreshRate
        type: integer
        description: "Maximum time the custom endpoint monitor waits between fetches for custom endpoint info."
        spellings:
          ruby: { name: custom_endpoint_info_max_refresh_rate_sec, type: float, required: "No", default: "300.0", unit: s, example: "600.0" }
      - concept: monitorExpiration
        type: integer
        description: "How long a monitor runs without use before expiring and being removed."
        spellings:
          ruby: { name: custom_endpoint_monitor_expiration_sec, type: float, required: "No", default: "900.0", unit: s, example: "600.0" }
      - concept: waitForInfo
        type: boolean
        description: "Whether to wait for custom endpoint info to become available before connecting or executing a method. Disabling this may result in occasional connections to instances outside of the custom endpoint."
        spellings:
          ruby: { name: wait_for_custom_endpoint_info, required: "No", default: "true", example: "true" }
      - concept: waitTimeout
        type: integer
        description: "Maximum time the plugin waits for custom endpoint info to be made available by the monitor."
        spellings:
          ruby: { name: wait_for_custom_endpoint_info_timeout_sec, type: float, required: "No", default: "5.0", unit: s, example: "7.0" }
      - concept: awsCredentialsProvider
        type: object
        availability: { ruby: true }
        description: "A custom AWS credentials provider instance. One property is read by every plugin that calls AWS — IAM authentication, Secrets Manager, KMS encryption and custom endpoint — so setting it once covers all of them. When unset, each falls back to the AWS SDK default credential provider chain. The custom endpoint monitor is shared by every connection to the same custom endpoint, so it uses the provider of the first connection that starts it."
        spellings:
          ruby: { name: aws_credentials_provider, required: "No", defaultNote: "SDK default chain", example: "Aws::AssumeRoleCredentials.new(...)" }
    prereqCount:
      ruby: 1
    wrapperOnly:
      ruby:
        - |
          ## Prerequisites

          :::warning
          The plugin calls the RDS `DescribeDBClusterEndpoints` API to track the custom
          endpoint's members, so add `aws-sdk-rds` to your Gemfile:

          ```ruby
          gem 'aws-sdk-rds'
          ```

          The plugin signs these calls with the provider given in `aws_credentials_provider`,
          or with the AWS SDK default credential provider chain when it is not set. See
          [AWS Credentials](../aws-credentials).
          :::

  # =========================================================================
  # Global Database (GDB) Failover Plugin
  # =========================================================================
  gdb-failover:
    availableWrappers: [ruby]
    intro: |
      In an [Amazon Aurora Global Database](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html),
      the primary DB cluster in one AWS region is replicated to secondary clusters in
      other regions. The Global Database (GDB) Failover Plugin extends failover with
      awareness of these regions so it can reconnect with minimal downtime when the
      primary region changes.

      The plugin introduces the notion of a **home region** and lets you configure
      different failover logic for the **in-home** case (the Global Database primary
      region is the home region) and the **out-of-home** case (the primary region is
      not the home region). For example, an application can follow the writer while
      the primary is local but connect to a nearby reader once the primary moves to
      another region.
    code:
      ruby: gdb_failover
    pluginGroup: failover
    availableSince:
      ruby: "1.0.0"
    enableSnippet:
      ruby: |
        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-global-db.global-xyz.global.rds.amazonaws.com",
          dbname: "mydb",
          wrapper_plugins: "gdb_failover",
          wrapper_dialect: "global-aurora-pg",
          failover_home_region: "us-west-1",
          global_cluster_instance_host_patterns: "?.xyz1.us-east-1.rds.amazonaws.com,?.xyz2.us-west-1.rds.amazonaws.com"
        )
    parameters:
      - concept: homeRegion
        type: string
        description: "The AWS region the application runs in. Determines which of the in-home and out-of-home modes applies. Defaults to the region parsed from the connection endpoint, and is required when the endpoint carries no region (a Global Database endpoint, an IP address, or a custom domain)."
        spellings:
          ruby: { name: failover_home_region, required: "Yes for endpoints with no region; otherwise No", defaultNote: "parsed from URL", example: "us-west-1" }
      - concept: inHomeMode
        type: string
        description:
          ruby: "Failover mode used while the Global Database primary region **is** the home region. Values include `strict_writer`, `home_reader_or_writer`, `strict_home_reader`, `strict_out_of_home_reader`, `strict_any_reader`, `out_of_home_reader_or_writer`, and `any_reader_or_writer`. When unset, the mode is derived from the initial connection endpoint: a writer or global writer cluster endpoint defaults to `strict_writer`, and any other endpoint defaults to `home_reader_or_writer`. This plugin does not read `failover_mode`; use this parameter and `out_of_home_failover_mode` instead."
        spellings:
          ruby: { name: in_home_failover_mode,  required: "No", defaultNote: "depends on URL", example: "strict_writer" }
      - concept: outHomeMode
        type: string
        description:
          ruby: "Failover mode used while the Global Database primary region **is not** the home region. Accepts the same values as the in-home mode. When unset, it is derived from the initial endpoint the same way as the in-home mode: a writer or global writer cluster endpoint defaults to `strict_writer`, and any other endpoint defaults to `home_reader_or_writer`."
        spellings:
          ruby: { name: out_of_home_failover_mode, required: "No", defaultNote: "depends on URL", example: "strict_any_reader" }
      - concept: globalHostPatterns
        type: string
        description: "Comma-separated instance host patterns for every Global Database region. Prefix custom-domain patterns with `[region]`. Required for Aurora Global Databases; ignored otherwise."
        spellings:
          ruby: { name: global_cluster_instance_host_patterns, required: "Yes for Global Databases; otherwise No", defaultNote: "none", example: "?.xyz1.us-east-1.rds.amazonaws.com,?.xyz2.us-west-1.rds.amazonaws.com" }
      - concept: accessibleRegions
        type: string
        description: "Comma-separated list of AWS regions the application can reach. When set, failover only considers nodes in these regions as candidates; topology monitoring still tracks every region. If the home region is also set, it must be included."
        spellings:
          ruby: { name: accessible_regions,   required: "No", defaultNote: "all regions", example: "us-east-1,us-west-1" }
      - concept: failoverTimeout
        type: integer
        description: "Maximum allowed time to attempt reconnecting to a new writer or reader instance after a cluster failover is initiated."
        spellings:
          ruby: { name: failover_timeout_sec, type: float, required: "No", default: "300.0",    unit: s,  example: "300.0" }
      - concept: topologyRefreshRate
        type: integer
        description: "Cluster topology refresh rate while the cluster is not in failover (the regular slow monitoring rate)."
        spellings:
          ruby: { name: cluster_topology_refresh_rate_sec, type: float, required: "No", default: "5.0", unit: s, example: "5.0" }
      - concept: readerStrategy
        type: string
        description: "Strategy used to select a reader node during failover. See [host selection strategies](../host-selection-strategies) for the available values."
        spellings:
          ruby: { name: failover_reader_host_selector_strategy, required: "No", default: "random", example: "random" }
      - concept: topologyHighRefreshRate
        type: integer
        description: "Interval between topology updates during the high-rate period after a new writer is detected."
        spellings:
          ruby: { name: cluster_topology_high_refresh_rate_sec, type: float, required: "No", default: "0.1", unit: s, example: "0.1" }
      - concept: maxInstanceMonitors
        type: integer
        description: "Maximum number of per-instance topology monitors run in parallel during a topology update. When the cluster has more instances than this, only the first that many are monitored concurrently."
        spellings:
          ruby: { name: cluster_topology_max_instance_monitors, required: "No", default: "16", example: "16" }
      - concept: clusterId
        type: string
        description: "Unique identifier for a cluster. Connections with the same identifier share one topology monitor and cache; different clusters must use different identifiers. See [Cluster ID](../cluster-id)."
        spellings:
          ruby: { name: cluster_id, required: "Required when one application uses multiple clusters; otherwise No", default: "1", example: "my-global-db" }
      - concept: enableConnectFailover
        type: boolean
        description: "Enables cluster-aware failover when the initial connection fails because of a network exception. The initial connection may be redirected to another instance."
        spellings:
          ruby: { name: enable_connect_failover, required: "No", default: "false", example: "true" }
    configExamples:
      # Ported from the two most instructive scenarios: a writer connection
      # and a home-region reader. Together they cover both host roles and the two
      # failover modes a reader/writer choice implies. Property names and mode
      # values are the Ruby spellings — Ruby accepts kebab-case too, but its own
      # property documentation lists snake_case, so that is what is shown.
      ruby:
        - title: "Writer connection with in-region failover"
          goal: "An application deployed in `us-west-1` needs a writer connection to a global database spanning `us-east-1`, `us-west-1`, and `us-east-2`."
          settings:
            - "`failover_home_region: us-west-1` — required here, because a global endpoint carries no region for the wrapper to parse"
            - "`in_home_failover_mode: strict_writer` and `out_of_home_failover_mode: strict_writer` — always reconnect to the writer, wherever the primary region currently is"
            - "`global_cluster_instance_host_patterns` — one pattern per region, so the wrapper can reach individual instances"
            - "`wrapper_dialect: global-aurora-pg` (or `global-aurora-mysql`)"
            - "`wrapper_plugins: initial_connection,gdb_failover`"
            - "point `host` at the global database endpoint"
          lang: yaml
          code: |
            # config/database.yml
            production:
              adapter: aws_postgresql
              host: my-global-db.global-xyz.global.rds.amazonaws.com
              database: mydb
              username: <username>
              password: <password>
              wrapper_plugins: initial_connection,gdb_failover
              wrapper_dialect: global-aurora-pg
              failover_home_region: us-west-1
              in_home_failover_mode: strict_writer
              out_of_home_failover_mode: strict_writer
              global_cluster_instance_host_patterns: "?.xyz1.us-east-1.rds.amazonaws.com,?.xyz2.us-west-1.rds.amazonaws.com,?.xyz3.us-east-2.rds.amazonaws.com"
          note: >-
            Both modes are `strict_writer`, so a switchover to another region still
            leaves this connection on a writer. Writes then cross regions, which
            costs latency — that is the trade this configuration makes to keep
            writes working.

        - title: "Prefer a home-region reader on cross-region failover"
          goal: "A reporting connection in `us-west-1` should read locally, and should keep preferring `us-west-1` readers even after the primary region switches over."
          settings:
            - "`failover_home_region: us-west-1` — optional here, since a regional reader endpoint already carries the region, but stating it keeps the intent explicit"
            - "`in_home_failover_mode: strict_home_reader` and `out_of_home_failover_mode: strict_home_reader` — stay on a reader in the home region either way"
            - "`global_cluster_instance_host_patterns` and `wrapper_dialect` — same as above"
            - "`wrapper_plugins: initial_connection,gdb_failover`"
            - "point `host` at the cluster reader endpoint in `us-west-1`"
          lang: yaml
          code: |
            # config/database.yml
            production:
              adapter: aws_postgresql
              host: my-cluster.cluster-ro-xyz2.us-west-1.rds.amazonaws.com
              database: mydb
              username: <username>
              password: <password>
              wrapper_plugins: initial_connection,gdb_failover
              wrapper_dialect: global-aurora-pg
              failover_home_region: us-west-1
              in_home_failover_mode: strict_home_reader
              out_of_home_failover_mode: strict_home_reader
              global_cluster_instance_host_patterns: "?.xyz1.us-east-1.rds.amazonaws.com,?.xyz2.us-west-1.rds.amazonaws.com,?.xyz3.us-east-2.rds.amazonaws.com"
          note: >-
            This is the entry to use as the `reading` role when you pair it with a
            writer through `connects_to`. Reads never leave `us-west-1`, so this
            connection cannot write — pair it with a writer configuration for
            anything that does.

  # =========================================================================
  # Aurora Initial Connection Strategy Plugin
  # =========================================================================
  initial-connection-strategy:
    availableWrappers: [ruby]
    intro: |
      The Initial Connection Strategy Plugin controls how the initial connection to a
      cluster is established and verified, and it obtains a connection more reliably
      while DNS is updating. When the initial connection is to a reader or custom
      cluster endpoint, the connected host is chosen according to the configured
      [host selection strategy](../host-selection-strategies).

      When you connect to a cluster endpoint, the instance for a new connection is
      resolved by DNS. During failover the cluster elects another instance to be the
      writer, and while DNS is updating — which can take up to 40–60 seconds — a
      connection to the cluster endpoint may land on an old node. This plugin helps
      by replacing the outdated endpoint while DNS is updating. It also recognizes an
      Aurora Global Writer Endpoint and substitutes it with the current writer
      endpoint.

      This plugin is part of the default plugin list as of v1.0.0: it resolves a cluster
      endpoint to a specific instance and distributes new connections across the
      cluster's instances. On an Aurora custom endpoint it passes the endpoint through
      unchanged unless `initial_connection_substitute_host` is set to `any` or `reader`.
      It does not apply where there is no cluster endpoint to resolve (for example
      behind an RDS Proxy), and should be left out there.
    code:
      ruby: initial_connection
    availableSince:
      ruby: "1.0.0 (default plugin)"
    enableSnippet:
      ruby: |
        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-cluster.cluster-ro-xyz.us-east-1.rds.amazonaws.com",
          dbname: "mydb",
          wrapper_plugins: "initial_connection"
        )
    parameters:
      - concept: substitutionRole
        type: string
        description: "Whether the initial connection URL should be replaced with an instance URL from the topology when available, and the role of the instance to select. For writer or global writer endpoints, valid values are `writer` and `none`; for reader endpoints, `reader` and `none`; for custom cluster endpoints with the custom endpoint plugin enabled, `any`, `reader`, or `none`. `none` disables substitution. When unset, the default is derived from the endpoint type: a writer or global writer cluster endpoint substitutes a `writer`, a reader cluster endpoint substitutes a `reader`, and any other endpoint (instance, custom, or non-RDS) performs no substitution."
        spellings:
          ruby: { name: initial_connection_substitute_host, required: "No", defaultNote: "depends on endpoint type", example: "reader" }
      - concept: verifyRole
        type: string
        description: "Whether an opened connection should be verified to be a writer or reader after connecting, or if no role verification should be performed. `none` disables verification. When unset, the default is derived from the endpoint type: a writer or global writer cluster endpoint verifies `writer`, a reader cluster endpoint verifies `reader`, and any other endpoint performs no verification."
        spellings:
          ruby: { name: initial_connection_verify_role, required: "No", defaultNote: "depends on endpoint type", example: "reader" }
      - concept: hostStrategy
        type: string
        description: "Strategy used to select a host when opening a new connection, applied after the substitution role narrows the candidates. See [host selection strategies](../host-selection-strategies) for the available values."
        spellings:
          ruby: { name: initial_connection_host_selector_strategy, required: "No", default: "random", example: "random" }
      - concept: retryTimeout
        type: integer
        description: "Maximum allowed time for retries when opening a connection."
        spellings:
          ruby: { name: initial_connection_retry_timeout_sec, type: float, required: "No", default: "30.0", unit: s, example: "40.0" }
      - concept: retryInterval
        type: integer
        description: "The time between retries when opening a connection."
        spellings:
          ruby: { name: initial_connection_retry_interval_sec, type: float, required: "No", default: "1.0", unit: s, example: "2.0" }
      - concept: waitForTopology
        type: long
        description: "Maximum allowed time to wait for the cluster topology to be fetched before opening a new connection. When greater than `0` and topology is not yet available, the plugin blocks until topology is discovered (or the timeout is reached) rather than falling back to the cluster endpoint. This helps host selection strategies distribute concurrent and pool-prefill connections across instances. A value of `0` means the plugin will not wait for topology information if it is not yet available and may occasionally use the cluster endpoint in these scenarios."
        spellings:
          ruby: { name: initial_connection_wait_for_topology_sec, type: float, required: "No", default: "0.0", unit: s, example: "30.0" }
      - concept: inactiveSubstitutionRole
        type: string
        description: "Whether an inactive cluster writer endpoint in the initial connection URL should be replaced with a writer instance URL from the topology when available. Applicable to Aurora Global Databases. Valid values are `writer` and `none`."
        spellings:
          ruby: { name: initial_connection_inactive_substitute_host,   required: "No", defaultNote: "passthrough", example: "writer" }
      - concept: inactiveVerifyRole
        type: string
        description: "Whether a connection opened with an inactive cluster writer endpoint should be verified to be a writer. Applicable to Aurora Global Databases. Valid values are `writer` and `none`. When unset, the connection is verified to be a writer only if the endpoint was substituted with a writer instance; otherwise no verification is performed."
        spellings:
          ruby: { name: initial_connection_inactive_verify_role,           required: "No", defaultNote: "writer if a writer was substituted; otherwise none", example: "writer" }
      - concept: accessibleRegions
        type: string
        availability: { ruby: true }
        description: "Comma-separated list of AWS regions the application can reach. Applicable to Aurora Global Databases, the only deployment whose instances span multiple regions. When set, candidate hosts in regions not listed are excluded before host selection."
        spellings:
          ruby: { name: accessible_regions,   required: "No", defaultNote: "all regions", example: "us-east-1,us-west-1" }

  # =========================================================================
  # Blue/Green Deployment Plugin
  # =========================================================================
  blue-green:
    availableWrappers: [ruby]
    intro: |
      The [Blue/Green Deployment](https://docs.aws.amazon.com/whitepapers/latest/blue-green-deployments/introduction.html)
      technique releases changes by shifting traffic between two identical
      environments running different versions, reducing downtime and rollback risk.
      During an
      [RDS/Aurora Blue/Green switchover](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments-switching.html),
      connections to blue nodes terminate, endpoints are redirected, internal node
      names change, and certificates are regenerated — all of which can disrupt an
      application.

      The Blue/Green Deployment Plugin minimizes that disruption by actively monitoring
      switchover status and adjusting connection handling at each phase:

      - **Before the switchover**, it inventories the blue and green endpoints and their IP addresses.
      - **During the active switchover**, it temporarily suspends calls to blue nodes and substitutes hostnames with the corresponding IP addresses to avoid stale DNS.
      - **After the switchover**, it monitors DNS until blue endpoints are reconfigured, then stops substituting.
      - **Once switchover completes**, it rejects new connections to green nodes.
      - **If the switchover fails or rolls back**, it detects that and restores normal handling.
    code:
      ruby: bg
    availableSince:
      ruby: "1.0.0"
    supported: |
      **Currently supported deployments:**
      - Aurora MySQL and PostgreSQL clusters
      - RDS MySQL and PostgreSQL instances

      **Unsupported deployments and configurations:**
      - RDS MySQL and PostgreSQL Multi-AZ clusters
      - Aurora Global Database for MySQL and PostgreSQL
      - Connecting to database nodes using CNAME aliases

      Full Blue/Green support also requires a minimum database engine version that includes
      a specific metadata table (and, on RDS PostgreSQL, the `rds_tools` extension). If the
      version does not include it, the plugin detects its absence and falls back to its
      previous behavior — no action required. See
      [Known limitation](#known-limitation) below for the minimum versions and setup.
    enableSnippet:
      ruby: |
        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
          dbname: "mydb",
          wrapper_plugins: "bg"
        )
    parameters:
      - concept: bgdId
        type: string
        description: "Identifier that distinguishes different Blue/Green Deployments. Required when supporting multiple deployments: all connection strings for the same deployment must share the same value, and different deployments must use distinct values."
        spellings:
          ruby: { name: bgd_id, required: "Yes for multiple deployments; otherwise No", default: "1", example: "abc-1" }
      - concept: connectTimeout
        type: integer
        description: "Maximum waiting time for establishing new connections during a switchover while blue and green traffic is temporarily suspended."
        spellings:
          ruby: { name: bg_connect_timeout_sec, type: float, required: "No", default: "30.0", unit: s, example: "30.0" }
      - concept: baseline
        type: integer
        description:
          ruby: "Baseline interval for checking Blue/Green Deployment status. Keep this below 900 sec (15 minutes)."
        spellings:
          ruby: { name: bg_baseline_sec, type: float, required: "No", default: "60.0", unit: s, example: "60.0" }
      - concept: increased
        type: integer
        description:
          ruby: "Increased interval for checking Blue/Green Deployment status. Configure within 0.5–2 sec."
        spellings:
          ruby: { name: bg_increased_sec, type: float, required: "No", default: "1.0", unit: s, example: "1.0" }
      - concept: high
        type: integer
        description:
          ruby: "High-frequency interval for checking Blue/Green Deployment status. Configure within 0.05–0.5 sec."
        spellings:
          ruby: { name: bg_high_sec, type: float, required: "No", default: "0.1", unit: s, example: "0.1" }
      - concept: switchoverTimeout
        type: integer
        description: "Maximum duration allowed for switchover completion. If the process stalls or exceeds this, the wrapper assumes completion and resumes normal operations."
        spellings:
          ruby: { name: bg_switchover_timeout_sec, type: float, required: "No", default: "180.0", unit: s, example: "180.0" }
    monitoringPrefix:
      ruby: "bg_monitoring_"
    monitoringSnippet:
      ruby: |
        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
          dbname: "mydb",
          wrapper_plugins: "bg",
          # The prefix is stripped and the setting is passed to the underlying driver, so use
          # an option the driver accepts (e.g. pg: keepalives_idle; mysql2: read_timeout).
          bg_monitoring_connect_timeout: 10
        )
    prereqCount:
      ruby: 0
    wrapperOnly:
      ruby:
        - |
          ## Known limitation

          Full Blue/Green support requires a minimum database engine version that includes
          a specific metadata table. When the green deployment meets the minimum version,
          the metadata is available and the plugin uses its enhanced handling; otherwise
          the plugin automatically detects the table's absence and falls back to its
          previous behavior, subject to the limitations listed above. No action is required
          for that fallback. This version constraint does **not** apply to RDS MySQL.

          For RDS PostgreSQL you must also install the `rds_tools` extension so the
          metadata is exposed:

          ```sql
          CREATE EXTENSION rds_tools;
          ```

          Minimum engine versions that include the metadata table:

          | Engine              | Minimum version                                                            |
          |---------------------|----------------------------------------------------------------------------|
          | Aurora PostgreSQL   | Engine release `17.5`, `16.9`, `15.13`, `14.18`, `13.21`, or above         |
          | Aurora MySQL        | Engine release `3.07` or above                                             |
          | RDS PostgreSQL      | `rds_tools v1.7` (`17.1`, `16.5`, `15.9`, `14.14`, `13.17`, `12.21`) or above |
          | RDS MySQL           | No metadata-table version requirement                                      |

          Aurora PostgreSQL clusters running engine release `17.7, 16.11, 15.15, 14.20,
          13.23` or above experience shorter switchover downtime than earlier versions
          (following the source/blue cluster's engine version).
