name: Deploy Docs to GitHub Pages

# Publishes the Docusaurus build to https://aws.github.io/aws-advanced-wrapper-docs/.
#
# Runs on every push to main that touches the content, the generator, or the
# site. Merges are already gated on Verify Docs (see verify-docs.yml), so by
# the time we get here the generated files are known-fresh; this workflow
# still re-runs `python generate.py` before building so a hand-edited main
# branch cannot ship stale content.
#
# The repo's Pages setting must be:
#     Settings -> Pages -> Source: "GitHub Actions"
# If it is set to "Deploy from a branch", this workflow will succeed but its
# output will not be served.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'generate.py'
      - 'requirements.txt'
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Least-privilege token, plus the two extra scopes Pages deploys need.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one live Pages deployment at a time. Don't cancel in-progress deploys —
# a half-finished deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install generator dependencies
        run: pip install -r requirements.txt

      - name: Re-run the generator
        run: python generate.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        run: npm run build

      # NOTE: This inlines actions/upload-pages-artifact@v3.0.1 rather than
      # calling it. That action's final step is `actions/upload-artifact@v4`
      # (a tag, not a SHA), which this repo's enterprise "actions must be
      # pinned to a full-length commit SHA" policy rejects transitively — so
      # the composite action cannot be used as-is (it fails the deploy with
      # "actions/upload-artifact@v4 is not allowed ... must be pinned to a
      # full-length commit SHA"). We reproduce its two steps here with
      # upload-artifact pinned to a real SHA on the SAME major (v4) the Pages
      # pipeline was built against, so the artifact format stays exactly what
      # actions/deploy-pages@v4.0.5 expects. The tar invocation mirrors
      # upstream (Linux runner): archive into $RUNNER_TEMP/artifact.tar with
      # --dereference --hard-dereference, excluding .git/.github, uploaded under
      # the artifact name `github-pages` that actions/deploy-pages downloads.
      #
      # Dependabot is configured to ignore actions/upload-artifact for this
      # reason (see .github/dependabot.yml) so it does not raise PRs against
      # this deliberately-pinned reference.
      #
      # TODO: Once actions/upload-pages-artifact cuts a RELEASE whose inner
      # actions/upload-artifact is pinned to a full commit SHA (the fix is
      # already on its `main` branch — actions/upload-artifact@043fb46 = v7.0.1
      # — but not yet in a tagged upload-pages-artifact release), revert to a
      # single step:
      #     uses: actions/upload-pages-artifact@<that-release-sha>  # <version>
      #     with:
      #       path: site/build
      # then delete these two steps, this note, and the matching
      # actions/upload-artifact ignore entry in .github/dependabot.yml.
      - name: Archive the built site into a Pages artifact tarball
        run: |
          tar \
            --dereference --hard-dereference \
            --directory site/build \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
