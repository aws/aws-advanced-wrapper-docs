# Imported matrices. Values: true (compatible) / false (incompatible), with
# an optional note. Keyed by the plugin catalog 'key' above.
# ---------------------------------------------------------------------------
databaseTypeColumns:
  - Aurora Global Database (MySQL and PG)
  - Aurora Cluster (MySQL and PG)
  - RDS Multi-AZ DB Cluster deployment (3 instances) (MySQL and PG)
  - RDS Multi-AZ DB Instance deployment (2 instances) (MySQL and PG)
  - RDS Single-AZ Instance deployment (1 instance) (MySQL and PG)
  - Community Database (MySQL and PG)

endpointColumns:
  - Aurora Global Database Endpoint
  - Aurora Cluster Writer Endpoint
  - Aurora Cluster Reader Endpoint
  - Aurora Cluster Custom Endpoint
  - Aurora Instance Endpoint, RDS Instance Endpoint
  - RDS Multi-AZ DB Cluster Writer Endpoint
  - RDS Multi-AZ DB Cluster Reader Endpoint
  - RDS Proxy Endpoint
  - DB Shard Group Endpoint (Aurora Limitless)
  - IP address
  - User custom domain (CNAME alias)

