crossPlugins:
  failover2:
    gdbFailover: { value: no, note: "Both drive cluster failover; gdb_failover is the region-aware superset, so running both means two components contend over reconnection and topology." }
  gdbFailover:
    failover2: { value: no, note: "Both drive cluster failover; gdb_failover is the region-aware superset, so running both means two components contend over reconnection and topology." }
  iam:
    failover2: { value: yes }
    gdbFailover: { value: yes }
  awsSecretsManager:
    failover2: { value: yes }
    gdbFailover: { value: yes }
    iam: { value: no, note: "Two authentication plugins both trying to set the connection credential; only one authentication plugin may be active at a time." }
  customEndpoint:
    failover2: { value: yes }
    gdbFailover: { value: no, note: "Meaningless: a custom endpoint is a single-region Aurora cluster construct, while gdb_failover operates across regions on a global database." }
    iam: { value: yes }
    awsSecretsManager: { value: yes }
  initialConnection:
    failover2: { value: yes }
    gdbFailover: { value: yes }
    iam: { value: yes }
    awsSecretsManager: { value: yes }
    customEndpoint: { value: yes }
  bg:
    failover2: { value: yes }
    gdbFailover: { value: no, note: "Meaningless: Blue/Green deployments are not supported on Aurora global databases." }
    iam: { value: yes }
    awsSecretsManager: { value: yes }
    customEndpoint: { value: no, note: "Meaningless: a Blue/Green switchover replaces the whole deployment, so a custom endpoint's hand-picked instance subset does not carry over." }
    initialConnection: { value: yes }

