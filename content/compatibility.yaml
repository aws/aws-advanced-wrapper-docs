# Registry for the Plugin Compatibility pages.
#
# `plugins`   — the plugin catalog. `key` indexes the matrices below; `codes`
#               gives each wrapper's plugin code (a wrapper that has no code for
#               a plugin is simply omitted from that wrapper's tables); `page`
#               is the site page to link to, when one exists.
# `universal` — plugins that are compatible with everything (no matrix row).
# `overrides` — per-wrapper corrections, used when a wrapper's implementation
#               differs from the shared matrix. Keyed by the wrapper's own code.
# The matrices themselves (databaseTypes / endpoints / crossPlugins) are keyed
# by `key` and were imported from the driver compatibility guide.

plugins:
  - key: customEndpoint
    codes: { ruby: custom_endpoint }
    page: using-plugins/custom-endpoint
  - key: failover2
    codes: { ruby: failover }
    page: enhanced-failover
  - key: gdbFailover
    codes: { ruby: gdb_failover }
    page: using-plugins/gdb-failover
  - key: iam
    codes: { ruby: iam }
    page: using-plugins/iam-authentication
  - key: awsSecretsManager
    codes: { ruby: secrets_manager }
    page: using-plugins/aws-secrets-manager
  - key: initialConnection
    codes: { ruby: initial_connection }
    page: using-plugins/initial-connection-strategy
  - key: bg
    codes: { ruby: bg }
    page: using-plugins/blue-green

universal:
  - key: kmsEncryption
    codes: { ruby: kms_encryption }
    page: using-plugins/kms-encryption
    description: "Transparent column-level encryption using AWS KMS."

# Reason text for the incompatible cells in the database-type and endpoint
# matrices. Cells tag a `reason:` key; the generator emits one footnote per
# distinct reason used in a matrix, so cells that share a rationale share a
# footnote. Keep the wording deployment-accurate, and flag combinations that
# are meaningless (technically loadable but pointless) as such.
reasons:
  needsAuroraCustomEndpoint: "The custom endpoint plugin tracks an Aurora custom endpoint, which only exists on an Aurora cluster; there is nothing for it to track here."
  failoverNeedsClusterTopology: "The failover plugin needs a cluster with more than one instance to promote; this deployment has no other instance to fail over to."
  gdbNeedsGlobal: "The global database failover plugin needs an Aurora global database spanning regions; this deployment is not one."
  gdbUseFailoverInstead: "The global database failover plugin can function here, but the failover plugin is recommended instead — it provides the same failover coverage for a single-region cluster while consuming fewer resources."
  initialConnNeedsClusterTopology: "The initial connection plugin resolves a cluster endpoint to an instance; this deployment has no cluster topology to resolve."
  awsAuthNotCommunity: "IAM and Secrets Manager authentication are Amazon RDS/Aurora features; a community database you run yourself does not support them."
  bgNotGlobal: "AWS does not support Blue/Green deployments on Aurora global databases."
  bgNotMultiAzCluster: "AWS Blue/Green deployments are not available for RDS Multi-AZ DB clusters (only for Multi-AZ DB instance deployments)."
  bgNotCommunity: "Blue/Green deployments are an Amazon RDS/Aurora feature; a community database you run yourself cannot use one."
  bgNotCname: "The Blue/Green plugin resolves the deployment from a recognizable RDS endpoint; it cannot follow a switchover behind a custom domain name."
  customEndpointOnlyCustom: "The custom endpoint plugin only applies to an Aurora custom endpoint; on any other endpoint there is no custom endpoint membership to track."
  failoverNotLimitless: "Aurora Limitless shard groups manage their own routing; the failover plugin does not operate on the Limitless shard-group endpoint."
  gdbNotLimitless: "Aurora Limitless shard groups manage their own routing; the global database failover plugin does not operate on the Limitless shard-group endpoint."
  bgNotLimitless: "Aurora Limitless shard groups manage their own routing; the Blue/Green plugin does not operate on the Limitless shard-group endpoint."
  initialConnNotCustomEndpoint: "The initial connection plugin is incompatible with the Aurora custom endpoint URL type."
  initialConnNeedsClusterEndpoint: "The initial connection plugin needs a cluster endpoint to resolve; this endpoint points at a single host or has no discoverable topology."
  proxyDoesOwnFailover: "An RDS Proxy performs its own failover. Connecting through that endpoint with a simple retry is the recommended configuration for handling a failover event."

# Endpoint reference list shown on the URL-type page.
endpointReference:
  - label: Aurora Global Database Endpoint
    pattern: "<global-db-name>.global-<XYZ>.global.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-connecting.html
  - label: Aurora Cluster Writer Endpoint
    pattern: "<cluster-name>.cluster-<XYZ>.<region>.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Cluster.html
  - label: Aurora Cluster Reader Endpoint
    pattern: "<cluster-name>.cluster-ro-<XYZ>.<region>.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Reader.html
  - label: Aurora Cluster Custom Endpoint
    pattern: "<custom-endpoint-name>.cluster-custom-<XYZ>.<region>.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Custom.html
  - label: Aurora Instance Endpoint
    pattern: "<instance-name>.<XYZ>.<region>.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Instance.html
  - label: RDS Multi-AZ DB Cluster Writer Endpoint
    pattern: "<cluster-name>.cluster-<XYZ>.<region>.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts-connection-management.html
  - label: RDS Multi-AZ DB Cluster Reader Endpoint
    pattern: "<cluster-name>.cluster-ro-<XYZ>.<region>.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts-connection-management.html
  - label: RDS Instance Endpoint
    pattern: "<instance-name>.<XYZ>.<region>.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts-connection-management.html
  - label: RDS Proxy Endpoint
    pattern: "<proxy-name>.proxy-<XYZ>.<region>.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/rds-proxy-endpoints.html
  - label: DB Shard Group Endpoint (Aurora Limitless)
    pattern: "<shard-group-name>.shardgrp-<XYZ>.<region>.rds.amazonaws.com"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/limitless-shard.html
  - label: IP address
    pattern: "IPv4 or IPv6, for example 8.8.0.0"
    url: https://en.wikipedia.org/wiki/IP_address
  - label: User custom domain (CNAME alias)
    pattern: "any other domain name, for example my-database.my-domain.com"
    url: null

# Per-wrapper corrections, keyed by the wrapper's own plugin code.
overrides:
  ruby:
    endpoints:
      failover:
        "RDS Proxy Endpoint":
          value: false
          reason: proxyDoesOwnFailover
          note: "the plugin rejects RDS Proxy endpoints, which perform their own failover"

