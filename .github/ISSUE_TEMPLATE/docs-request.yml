name: Docs improvement or request
description: Suggest new documentation, clarification, or an improvement to existing docs.
title: "[Docs request]: "
labels: ["documentation", "enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Use this to request **new or improved documentation** in this
        repository.


        For a feature in a **specific wrapper** (not its docs), open an issue on
        that wrapper's own repository — see the
        [Wrappers](https://github.com/aws/aws-advanced-wrapper-docs#wrappers)
        table.
  - type: dropdown
    id: wrapper
    attributes:
      label: Which wrapper's docs?
      options:
        - Ruby
        - Shared / site
        - Other / not sure
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What is missing or unclear?
      description: Describe the gap or the part of the docs that could be improved.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the content or change you would like.
    validations:
      required: false
