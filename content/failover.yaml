# Canonical registry for the Failover feature — the single source of truth.
# The build reads this and produces one clean, wrapper-specific doc page per
# wrapper. Because names/units come from here, the ms-vs-sec trap cannot be
# mistyped in prose.

# ---------------------------------------------------------------------------
# Parameter TYPE display map (canonical -> per-wrapper spelling).
# ---------------------------------------------------------------------------
typeNames:
  string:
    ruby: "String"
  boolean:
    ruby: "Boolean"
  integer:
    ruby: "Integer"
  float:
    ruby: "Float"

# ---------------------------------------------------------------------------
# This page's plugin identity.
# ---------------------------------------------------------------------------
page:
  pluginGroup: failover
  thisCode:
    ruby: failover

pluginGroupLabels:
  failover: "failover"
  auth: "authentication"

wrappers:
  ruby:
    wrapperName: "AWS Advanced Ruby Driver Wrapper"
    label: "Ruby"
    featureBlurb: "fast failover, IAM and AWS Secrets Manager authentication, Blue/Green Deployment support, and more"
    availableSince: "1.0.0 (default plugin)"
    codeLang: "ruby"
    pluginListParam: "wrapper_plugins"
    compatibilityGuide: "../compatibility"
    pluginGroups:
      failover: [failover, gdb_failover]
      auth: [iam, secrets_manager, federated_auth, okta]
    connectSnippet: |
      require 'aws_advanced_ruby_driver_wrapper/postgresql'

      conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
        host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
        dbname: "mydb",
        user: "<username>",
        password: "<password>",
        wrapper_plugins: "failover",
        failover_timeout_sec: 300.0  # SECONDS -- not milliseconds!
      )

    # The Overview page's "Getting started" section. A list of steps, each with an
    # optional heading and an ordered list of blocks; a block is either prose
    # (`text`) or a fenced code sample (`code` + `lang`).
    #
    # Active Record comes first because the adapters are the wrapper's primary
    # integration: changing the adapter name is the whole change. The gem name
    # matches its entry point file, so Bundler's default require loads it.
    gettingStarted:
      note: "Requires Ruby 3.3 or later. Tested with Active Record 7.2, 8.0, and 8.1, `pg` 1.6.3 or later, and `mysql2` 0.5.7 or later."
      steps:
        - title: "1. Add the gem"
          blocks:
            - lang: ruby
              code: |
                # Gemfile
                gem 'aws_advanced_ruby_driver_wrapper'
                gem 'pg'        # or: gem 'mysql2'
            - lang: bash
              code: |
                bundle install
            - text: >-
                Bundler requires the gem for you (in a plain Ruby script, add
                `require 'aws_advanced_ruby_driver_wrapper'`). That single require
                registers the Active Record adapters and makes the connection classes,
                error classes, and other public API available for direct use.

        - title: "2. Point Active Record at your cluster"
          blocks:
            - text: >-
                The wrapper registers two adapters, `aws_postgresql` and `aws_mysql2`,
                which are drop-in replacements for `postgresql` and `mysql2`. Change the
                adapter name and point the host at your cluster endpoint:
            - lang: yaml
              code: |
                # config/database.yml
                production:
                  adapter: aws_postgresql
                  host: my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com
                  database: mydb
                  username: <username>
                  password: <password>
            - text: >-
                That is the whole change — no application code moves. When
                `wrapper_plugins` is not set, the wrapper loads `failover` and
                `initial_connection`, so connections made through this adapter already
                recover when the cluster promotes a new writer. Enable more by adding
                wrapper properties alongside the Active Record keys. Setting
                `wrapper_plugins` replaces the default list rather than adding to it, so
                list the defaults you want to keep:
            - lang: yaml
              code: |
                production:
                  adapter: aws_postgresql
                  # ...
                  wrapper_plugins: failover,initial_connection,iam
                  iam_region: us-east-1
                  failover_timeout_sec: 300.0     # seconds
            - text: >-
                Active Record keeps its own connection pool and its reading and writing
                roles; the wrapper's plugins run underneath both.
            - text: |
                :::note Mixing wrapped and standard adapters in one application
                The wrapped adapters register their type information under the underlying
                `postgresql` and `mysql2` adapter names. If one application uses both a
                standard connection (`postgresql`/`mysql2`) and a wrapped one
                (`aws_postgresql`/`aws_mysql2`), a custom type registered for one is shared
                with the other, because both resolve under the same underlying adapter key.
                :::

        - title: "Or connect with the driver directly"
          blocks:
            - text: >-
                If you use the `pg` or `mysql2` gem without Active Record, the wrapper
                provides connection classes that stand in for `PG::Connection` and
                `Mysql2::Client`:
            - lang: ruby
              code: |
                # PostgreSQL (pg)
                conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
                  host: 'my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com',
                  dbname: 'mydb',
                  user: '<username>',
                  password: '<password>',
                  wrapper_plugins: 'failover',
                  failover_timeout_sec: 300.0
                )
            - lang: ruby
              code: |
                # MySQL (mysql2)
                conn = AwsAdvancedRubyDriverWrapper::WrapperMysql2Client.new(
                  host: 'my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com',
                  database: 'mydb',
                  username: '<username>',
                  password: '<password>',
                  wrapper_plugins: 'failover',
                  failover_timeout_sec: 300.0
                )
            - text: >-
                The calls your code already makes on the driver connection keep working,
                and the plugins act on each one.

        - title: "Next"
          blocks:
            - text: >-
                Not sure which plugins you need? [Set up by Scenario](setup) builds a
                configuration from a few questions about your application. To check a
                combination before shipping, see [Plugin Compatibility](compatibility).

parameters:
  - concept: failoverMode
    summary: "Prioritizes which node role the wrapper connects to during failover."
    type: string
    spellings:
      ruby: { name: failover_mode, required: "No", defaultNote: "depends on URL" }
  - concept: enableFailover
    summary: "Enables cluster-aware failover if the initial connection fails due to a network exception."
    type: boolean
    spellings:
      ruby: { name: enable_connect_failover,    required: "No", default: "false" }
  - concept: failoverTimeout
    summary: "Maximum time to wait to reconnect after failover is initiated."
    type: integer
    unitTrap: true
    spellings:
      ruby: { name: failover_timeout_sec, type: float, required: "No", unit: s,  default: "300.0" }
  - concept: failoverClusterTopologyRefreshRate
    summary: "How often to refresh cluster topology while the cluster is stable."
    type: integer
    unitTrap: true
    spellings:
      ruby: { name: cluster_topology_refresh_rate_sec,    type: float, required: "No", unit: s, default: "5.0" }
  - concept: failoverReaderHostSelectorStrategy
    summary: "Strategy used to select a new reader host while opening a new connection during reader failover."
    type: string
    availability: { ruby: true }
    spellings:
      ruby: { name: failover_reader_host_selector_strategy, required: "No", default: "random" }
  - concept: clusterInstanceHostPattern
    summary: "DNS pattern to build instance endpoints when connecting via IP/CNAME/custom domain ('?' = instance-id placeholder)."
    type: string
    spellings:
      ruby:
        name: cluster_instance_host_pattern
        required: "If connecting using an IP address or custom domain URL: Yes<br/><br/>Otherwise: No"
        defaultNote: "auto-derived"

errors:
  - concept: failoverFailed
    ruby: "FailoverFailedError"
    connectionValid: "No"
    reusable: "No"
    action: "Failover could not find a new instance. Wait until the server is available, then reconnect."
    detail:
      ruby: "The original connection failed, and the wrapper could not reconnect to a new instance before the failover attempt ended. Wait until the server is available, then reconnect."
  - concept: failoverSuccess
    ruby: "FailoverSuccessError"
    connectionValid: "Yes"
    reusable: "Yes"
    action: "Failover succeeded outside a transaction. Reconfigure session state, then replay the last statement."
    detail:
      ruby: "Failover succeeded outside a transaction. Session state from the original connection is lost. Reuse the connection, reconfigure its session state, and replay the statement that was interrupted."
  - concept: transactionResolutionUnknown
    ruby: "TransactionStateUnknownError"
    connectionValid: "Yes"
    reusable: "Yes"
    action: "Failover happened inside a transaction. Reconfigure session state, restart the transaction, replay all its statements."
    detail:
      ruby: "Failover happened inside a transaction. The wrapper cannot tell whether the transaction completed, so the outcome must be treated as unknown. Reuse and reconfigure the connection, restart the transaction, and replay all statements in it."

wrapperOnly:
  ruby:
    - |
      ### ActiveRecord integration

      Through ActiveRecord (the `aws_postgresql` / `aws_mysql2` adapters), the adapter's
      `translate_exception` decides what your code rescues, and only one failover error is
      translated:

      - `FailoverSuccessError` and `TransactionStateUnknownError` are re-raised
        **unchanged** after the adapter re-runs `configure_connection`. Your `rescue` sees
        the wrapper error itself, and the connection is live on the new writer.
      - `FailoverFailedError` is translated into `ActiveRecord::ConnectionFailed`, carrying
        the original error as its message, so it appears in logs as one wrapped line:

      ```text
      ActiveRecord::ConnectionFailed: AwsAdvancedRubyDriverWrapper::Errors::FailoverFailedError: Unable to connect to a writer instance
      ```

      So `ActiveRecord::ConnectionFailed` means failover **failed**. The adapter marks the
      connection broken, `active?` returns `false`, and ActiveRecord discards it and opens a
      fresh connection on the next checkout. Do not rescue and discard the connection
      yourself.
    - |
      ### Session state on failover

      The AWS Advanced Ruby Driver Wrapper's `SessionStateService` currently tracks transaction and
      autocommit state but does **not** yet transfer full session state across a
      failover. `configure_connection` restores what ActiveRecord configures itself, and the
      adapter clears its prepared-statement cache after failover so statements re-prepare
      automatically on next use. After a `FailoverSuccessError`, re-apply any other session
      settings your application depends on (search path, timezone, temporary tables, advisory
      locks) before replaying work.

# ---------------------------------------------------------------------------
# Enhanced Failover Plugin registry.
# ---------------------------------------------------------------------------
enhanced:
  pluginGroup: failover
  wrappers:
    ruby:
      pluginCode: failover
      legacyCode: null
      monitorName: ClusterTopologyMonitor
      legacyProviderName: Topology provider
      clusterIdParam: cluster_id
      availableSince: "1.0.0 (default plugin)"
      compatibilityGuide: "./compatibility"
      hostPatternParam: cluster_instance_host_pattern
      monitoringPrefix: "topology_monitoring_"
      connectSnippet: |
        require 'aws_advanced_ruby_driver_wrapper/postgresql'

        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
          dbname: "mydb",
          user: "<username>",
          password: "<password>",
          wrapper_plugins: "failover",
          failover_timeout_sec: 300.0 # seconds
        )
      monitoringSnippet: |
        conn = AwsAdvancedRubyDriverWrapper::WrapperPgConnection.new(
          host: "my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com",
          dbname: "mydb",
          user: "<username>",
          password: "<password>",
          wrapper_plugins: "failover",
          # The prefix is stripped and the setting is passed to the underlying driver, so use
          # an option the driver accepts (e.g. pg: keepalives_idle; mysql2: read_timeout).
          topology_monitoring_connect_timeout: 10
        )
      databaseProperty: dbname

  parameters:
    - concept: failoverMode
      type: string
      spellings:
        ruby:
          name: failover_mode
          required: "No"
          defaultNote: "depends on URL"
      description:
        ruby: "Defines the target role during failover: `strict_writer`, `reader_or_writer`, or `strict_reader`. A read-only cluster endpoint defaults to `reader_or_writer`; other URLs default to `strict_writer`."
    - concept: clusterInstanceHostPattern
      type: string
      spellings:
        ruby:
          name: cluster_instance_host_pattern
          required: "Required for IP addresses and custom domains; otherwise No"
          defaultNote: "auto-derived for recognizable RDS endpoints"
      description:
        ruby: "Pattern used to build instance endpoints when the connection host is not a recognizable RDS endpoint. Use `?` as the instance identifier placeholder."
    - concept: clusterTopologyRefreshRate
      type: integer
      unitTrap: true
      spellings:
        ruby: { name: cluster_topology_refresh_rate_sec, type: float, required: "No", unit: s, default: "5.0" }
      description:
        ruby: "Regular interval at which the topology monitor refreshes the cluster when it is stable."
    - concept: failoverTimeout
      type: integer
      unitTrap: true
      spellings:
        ruby: { name: failover_timeout_sec, type: float, required: "No", unit: s, default: "300.0" }
      description:
        ruby: "Maximum time allowed to reconnect to a new writer or reader after failover starts."
    - concept: clusterTopologyHighRefreshRate
      type: integer
      unitTrap: true
      spellings:
        ruby: { name: cluster_topology_high_refresh_rate_sec, type: float, required: "No", unit: s, default: "0.1" }
      description:
        ruby: "Interval between topology updates during the high-rate period after a new writer is detected."
    - concept: clusterTopologyMaxInstanceMonitors
      type: integer
      spellings:
        ruby: { name: cluster_topology_max_instance_monitors, required: "No", default: "16" }
      description:
        ruby: "Maximum number of per-instance topology monitors run in parallel during a topology update. When the cluster has more instances than this, only the first that many are monitored concurrently."
    - concept: failoverReaderHostSelectorStrategy
      type: string
      spellings:
        ruby: { name: failover_reader_host_selector_strategy, required: "No", default: "random" }
      description:
        ruby: "Strategy used to select a reader node during reader failover."
    - concept: clusterId
      type: string
      spellings:
        ruby: { name: cluster_id, required: "Required when one application uses multiple clusters; otherwise No", default: "1" }
      description:
        ruby: "Unique identifier for a cluster. Connections with the same identifier share one topology monitor and cache; different clusters must use different identifiers."
    - concept: enableConnectFailover
      type: boolean
      availability: { ruby: true }
      spellings:
        ruby: { name: enable_connect_failover, required: "No", default: "false" }
      description:
        ruby: "Enables cluster-aware failover when the initial connection fails because of a network exception. The initial connection may be redirected to another instance."

  # Optional, per-wrapper. Rendered right after the "Do not dispose the connection"
  # caution, where third-party/ORM reconnection behavior is relevant. When a wrapper is
  # used through a third-party provider (e.g. an ORM) the reconnection can be partially
  # handled or behave differently, so this note explains that. Omit for wrappers that
  # have nothing to add.
  thirdPartyNote:
    ruby: |
      :::note Using the wrapper through ActiveRecord
      When you use the wrapper through ActiveRecord (`aws_postgresql` or `aws_mysql2`),
      reconnection is partially handled for you. On a successful failover the adapter
      re-runs `configure_connection` and reuses the pooled connection in place rather than
      discarding it, so you should not call `disconnect!` or discard the connection object
      yourself — the pool already holds the live, reconnected connection.
      :::

  wrapperOnly:
    ruby:
      - |
        ## ActiveRecord integration

        When using the wrapper through ActiveRecord (`aws_postgresql` or `aws_mysql2`), the
        adapter's `translate_exception` decides what your code actually rescues, and the
        outcome differs by error:

        - **`FailoverSuccessError`** — failover succeeded outside a transaction. The adapter
          re-runs `configure_connection` and then re-raises this error **unchanged**, so your
          `rescue` sees `AwsAdvancedRubyDriverWrapper::Errors::FailoverSuccessError`, not an
          ActiveRecord error. The connection is live and pointed at the new writer; replay the
          work.
        - **`TransactionStateUnknownError`** — failover succeeded while a transaction was open.
          Handled the same way, and also re-raised unchanged. The transaction's outcome is
          genuinely unknown, so check before retrying anything that is not idempotent.
        - **`FailoverFailedError`** — failover could not reach a writer in time. Only this one
          is translated, into `ActiveRecord::ConnectionFailed`, carrying the original error as
          its message. In your logs it appears as a single wrapped line:

        ```text
        ActiveRecord::ConnectionFailed: AwsAdvancedRubyDriverWrapper::Errors::FailoverFailedError: Unable to connect to a writer instance
        ```

        Seeing `ActiveRecord::ConnectionFailed` therefore means failover **failed**, not that
        it succeeded. The adapter marks the connection broken, so `active?` returns `false` and
        ActiveRecord discards it and opens a fresh one on the next checkout. Do not rescue and
        discard the connection yourself.

        The AWS Advanced Ruby Driver Wrapper's `SessionStateService` tracks transaction and
        autocommit state but does not transfer every session setting across a failover.
        `configure_connection` restores what ActiveRecord itself configures, and the adapter
        clears its prepared-statement cache after failover (`clear_cache!(new_connection: true)`)
        so statements prepared on the old physical connection are re-prepared automatically on
        their next use rather than failing. Anything else your application depends on — search
        path, timezone, temporary tables, advisory locks — is yours to re-apply before replaying
        work.
      - |
        ## Re-applying session state automatically after failover

        ActiveRecord runs its adapter's `configure_connection` step whenever it configures a
        connection — including immediately after a successful failover, because the adapter
        calls `configure_connection` while handling `FailoverSuccessError` and
        `TransactionStateUnknownError`. `configure_connection` applies the session variables you
        declare through the adapter's `variables:` option, so any `SET`-style session state
        listed there is re-applied to the new connection on failover without extra code:

        ```yaml
        # config/database.yml
        production:
          adapter: aws_postgresql
          host: my-cluster.cluster-xyz.us-east-1.rds.amazonaws.com
          database: mydb
          username: <username>
          password: <password>
          wrapper_plugins: failover
          variables:
            statement_timeout: 5000
            timezone: "UTC"
        ```

        Put the session settings your application relies on under `variables:`. Because the
        pooled connection object is preserved across failover (the adapter reconnects it in
        place rather than discarding it), and `configure_connection` re-runs on the new writer,
        those variables are restored automatically. The adapter also clears its prepared-statement
        cache on failover, so statements re-prepare themselves on next use. Session state that is
        *not* expressed as a `variables:` entry and is not a prepared statement — for example
        temporary tables or advisory locks — is still yours to re-establish before replaying work.
      - |
        ## Failover in forking web servers and job workers

        The topology monitor runs in background threads, and those threads do not survive a
        `fork`. When a process forks — Puma with `preload_app!`, Unicorn workers, Resque jobs —
        the child starts its own monitors on first use and leaves the parent's monitoring
        connections untouched, so the child discovers topology and fails over on its own.
        Failover works in forked workers with no extra configuration.
