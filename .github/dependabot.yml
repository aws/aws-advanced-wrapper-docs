version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # @mermaid-js/layout-elk is a dependency of @docusaurus/theme-mermaid, which
      # requires ^0.1.9. A previous Dependabot PR bumped it which breaks `npm install`
      # (ERESOLVE) and the Docusaurus build. Block major and minor bumps until
      # theme-mermaid declares support for them. Remove this entry when that happens.
      - dependency-name: "@mermaid-js/layout-elk"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      site-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      # deploy-pages.yml pins actions/upload-artifact by SHA on purpose: it is
      # an inlined replacement for actions/upload-pages-artifact@v3.0.1 (whose
      # internal actions/upload-artifact@v4 tag is rejected by the enterprise
      # SHA-pinning policy). We deliberately track the v4 major the Pages
      # pipeline was built for, so Dependabot must not raise bump PRs on it.
      # Remove this entry when that inlining is reverted (see the TODO in
      # .github/workflows/deploy-pages.yml).
      - dependency-name: "actions/upload-artifact"
